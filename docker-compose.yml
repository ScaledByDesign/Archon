services:
  # Core Infrastructure
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:-secretpass}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      TZ: America/Chicago
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network
      - database_network
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      TZ: America/Chicago
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis-pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network
      - database_network
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-change-me-mongo-pass}
      TZ: America/Chicago
    volumes:
      - mongo_data:/data/db
      - ./config/mongodb/init-multiple-databases.js:/docker-entrypoint-initdb.d/init-multiple-databases.js:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database_network
    ports:
      - "27017:27017"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      TZ: America/Chicago
    volumes:
      - qdrant_data:/qdrant/storage
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qdrant.rule=Host(`qdrant.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.qdrant.entrypoints=websecure"
      - "traefik.http.routers.qdrant.middlewares=authentik-forward-auth@file"
      # - "traefik.http.routers.qdrant.tls.certresolver=letsencrypt"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"
    networks:
      - backend_network
      - database_network
      - frontend_network

  # LLM Proxy
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-1234}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TZ=America/Chicago
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY:-sk-XXXXXXXX}
      - DATABASE_URL=postgresql://${PG_USER:-postgres}:${PG_PASS:-secretpass}@postgres:5432/postgres
      - PORT=4000
      - STORE_MODEL_IN_DB="True"
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/4000' && echo 'OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.llm.rule=Host(`llm.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.llm.entrypoints=websecure"
      - "traefik.http.routers.llm.middlewares=authentik-forward-auth@file"
      # - "traefik.http.routers.llm.tls.certresolver=letsencrypt"
      - "traefik.http.services.llm.loadbalancer.server.port=4000"
    networks:
      - backend_network
      - frontend_network

  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard port
      - "8081:8081"  # Insecure API port
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/configuration/dynamic:ro
      - ./config/traefik/certs:/certs:ro
      - traefik_certs:/letsencrypt
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DOMAIN=zoi.local
      - ACME_EMAIL=${ACME_EMAIL}
      - TZ=America/Chicago
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      # - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.middlewares=authentik-forward-auth@file"
      - "traefik.http.routers.dashboard.service=api@internal"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frontend_network
      - backend_network
      - infrastructure_network

  # FastAPI Services
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./requirements.txt:/app/requirements.txt:ro
    env_file:
      - .env
      - ./config/fastapi/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN:-zoi.local}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.middlewares=authentik-forward-auth@file"
      # - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    networks:
      - backend_network
      - frontend_network
      - database_network
      - infrastructure_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-worker
    restart: unless-stopped
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./requirements.txt:/app/requirements.txt:ro
    env_file:
      - .env
      - ./config/fastapi/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend_network
      - database_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # Optional Services
  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    restart: unless-stopped
    ports:
      - "4001:8080"
    volumes:
      - ./config/dashy/conf.yml:/app/user-data/conf.yml:ro
      - dashy_data:/app/user-data/icons
    environment:
      - NODE_ENV=production
      - UID=1000
      - GID=1000
      - CONFIG_PATH=/app/user-data/conf.yml
    healthcheck:
      test: ["CMD", "node", "/app/services/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend_network
      - monitoring_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashy.rule=Host(`dashy.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.dashy.entrypoints=websecure"
      - "traefik.http.routers.dashy.middlewares=authentik-forward-auth@file"
      # - "traefik.http.routers.dashy.tls.certresolver=letsencrypt"
      - "traefik.http.services.dashy.loadbalancer.server.port=8080"

  # Authentication & Identity Provider
  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-server
    restart: unless-stopped
    entrypoint: ["/bin/bash"]
    command: ["/blueprints/startup-scripts/entrypoint-with-blueprints.sh"]
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./config/authentik/blueprints:/blueprints/custom
      - ./config/authentik/startup-scripts:/blueprints/startup-scripts:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
      - ./config/authentik/authentik.env
    environment:
      - AUTHENTIK_HOST_BROWSER=https://auth.zoi.local
    ports:
      - "9000:9000"
      - "9444:9443"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      traefik:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`auth.${DOMAIN:-localhost}`) || (HostRegexp(`{subdomain:[a-z0-9]+}.${DOMAIN:-localhost}`) && PathPrefix(`/outpost.goauthentik.io/`))"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      # - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      start_period: 30s
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - auth_network
      - frontend_network
      - backend_network
      - database_network

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./config/authentik/blueprints:/blueprints/custom
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
      - ./config/authentik/authentik.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      start_period: 30s
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - auth_network
      - backend_network
      - database_network

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  qdrant_data:
  traefik_certs:
  dashy_data:
  authentik_media:
  authentik_templates:

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
  database_network:
    driver: bridge
  infrastructure_network:
    driver: bridge
  monitoring_network:
    driver: bridge
  auth_network:
    driver: bridge
