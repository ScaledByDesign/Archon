version: '3.8'

services:
  # Authentication
  authentik-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${AUTHENTIK_REDIS_PASS:-redispass}
    environment:
      TZ: America/Chicago
    volumes:
      - authentik_redis:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth_network
      - backend_network

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.2
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_REDIS__PASSWORD: ${AUTHENTIK_REDIS_PASS:-redispass}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:-secretpass}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-me-to-a-long-random-string}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-change-me-authentik-admin}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-change-me-authentik-token}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@localhost}
      TZ: America/Chicago
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./config/authentik/blueprints:/blueprints/custom:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ./config/authentik/authentik.env
    ports:
      - "9000:9000"
      - "9443:9443"
    depends_on:
      - postgres
      - authentik-redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`auth.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      start_period: 30s
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - auth_network
      - frontend_network
      - backend_network

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.2
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_REDIS__PASSWORD: ${AUTHENTIK_REDIS_PASS:-redispass}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:-secretpass}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-me-to-a-long-random-string}
      TZ: America/Chicago
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./config/authentik/blueprints:/blueprints/custom:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ./config/authentik/authentik.env
    depends_on:
      - postgres
      - authentik-redis
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      start_period: 30s
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - auth_network
      - backend_network

  # Shared PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:-secretpass}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      TZ: America/Chicago
      # Initialize multiple databases
      POSTGRES_MULTIPLE_DATABASES: authentik,fastapi,healthchecks,langfuse
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth_network
      - backend_network
      - database_network

  # Reverse Proxy
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard port
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/configuration/dynamic:ro
      - ./config/traefik/certs:/certs:ro
      - traefik_certs:/letsencrypt
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL}
      - TZ=America/Chicago
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@file"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frontend_network
      - backend_network
      - infrastructure_network

  # Cache Layer
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      TZ: America/Chicago
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network
      - database_network

  redis-insight:
    image: redislabs/redisinsight:latest
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      TZ: America/Chicago
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend_network
      - monitoring_network

  # Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-secretpass}
      TZ: America/Chicago
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  # API Backend (Multiple Instances)
  fastapi-1: &fastapi
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_ROLE_ID=${VAULT_ROLE_ID}
      - VAULT_SECRET_ID=${VAULT_SECRET_ID}
      - VAULT_ROOT_TOKEN=${VAULT_ROOT_TOKEN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=fastapi
      - POSTGRES_PASSWORD=${PG_PASS}
      - POSTGRES_DB=fastapi
      - MONGODB_URL=mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-change-me-mongo-pass}@mongo-episodic:27017,mongo-procedural:27017
      - MONGODB_HOST=mongo-episodic
      - MONGODB_PORT=27017
      - MONGODB_USERNAME=${MONGO_USER:-admin}
      - MONGODB_PASSWORD=${MONGO_PASS:-change-me-mongo-pass}
      - MONGODB_DATABASE=episodic
      - QDRANT_URL=http://qdrant:6333
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-secretpass}@rabbitmq:5672
      - LITELLM_URL=http://litellm:8000
      - AUTHENTIK_URL=https://authentik-server:9443
      - INSTANCE_ID=1
      - FASTAPI_OAUTH_CLIENT_ID=${FASTAPI_OAUTH_CLIENT_ID}
      - FASTAPI_OAUTH_CLIENT_SECRET=${FASTAPI_OAUTH_CLIENT_SECRET}
      - FASTAPI_OAUTH_REDIRECT_URI=${FASTAPI_OAUTH_REDIRECT_URI}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-secret-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - JWT_EXPIRATION_TIME=${JWT_EXPIRATION_TIME:-3600}
      - JWT_REFRESH_EXPIRATION_TIME=${JWT_REFRESH_EXPIRATION_TIME:-86400}
      - JWT_ISSUER=${JWT_ISSUER:-rag-system}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-rag-system-api}
      - OAUTH_SCOPE=${OAUTH_SCOPE:-openid email profile rag:api}
      - OAUTH_PROVIDER_URL=${OAUTH_PROVIDER_URL:-https://authentik-server:9443}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080,http://localhost:8000}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-localhost,127.0.0.1,*.localhost}
      - TZ=America/Chicago
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.services.api.loadbalancer.sticky.cookie=true"
    networks:
      - backend_network
      - frontend_network
      - database_network
      - infrastructure_network

  fastapi-2:
    <<: *fastapi
    ports:
      - "8010:8000"
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_ROLE_ID=${VAULT_ROLE_ID}
      - VAULT_SECRET_ID=${VAULT_SECRET_ID}
      - VAULT_ROOT_TOKEN=${VAULT_ROOT_TOKEN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=fastapi
      - POSTGRES_PASSWORD=${PG_PASS}
      - POSTGRES_DB=fastapi
      - MONGODB_URL=mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-change-me-mongo-pass}@mongo-episodic:27017,mongo-procedural:27017
      - MONGODB_HOST=mongo-episodic
      - MONGODB_PORT=27017
      - MONGODB_USERNAME=${MONGO_USER:-admin}
      - MONGODB_PASSWORD=${MONGO_PASS:-change-me-mongo-pass}
      - MONGODB_DATABASE=episodic
      - QDRANT_URL=http://qdrant:6333
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-secretpass}@rabbitmq:5672
      - LITELLM_URL=http://litellm:8000
      - AUTHENTIK_URL=https://authentik-server:9443
      - INSTANCE_ID=2
      - FASTAPI_OAUTH_CLIENT_ID=${FASTAPI_OAUTH_CLIENT_ID}
      - FASTAPI_OAUTH_CLIENT_SECRET=${FASTAPI_OAUTH_CLIENT_SECRET}
      - FASTAPI_OAUTH_REDIRECT_URI=${FASTAPI_OAUTH_REDIRECT_URI}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-secret-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - JWT_EXPIRATION_TIME=${JWT_EXPIRATION_TIME:-3600}
      - JWT_REFRESH_EXPIRATION_TIME=${JWT_REFRESH_EXPIRATION_TIME:-86400}
      - JWT_ISSUER=${JWT_ISSUER:-rag-system}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-rag-system-api}
      - OAUTH_SCOPE=${OAUTH_SCOPE:-openid email profile rag:api}
      - OAUTH_PROVIDER_URL=${OAUTH_PROVIDER_URL:-https://authentik-server:9443}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080,http://localhost:8000}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-localhost,127.0.0.1,*.localhost}
      - TZ=America/Chicago
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend_network
      - frontend_network
      - database_network
      - infrastructure_network

  fastapi-3:
    <<: *fastapi
    ports:
      - "8020:8000"
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_ROLE_ID=${VAULT_ROLE_ID}
      - VAULT_SECRET_ID=${VAULT_SECRET_ID}
      - VAULT_ROOT_TOKEN=${VAULT_ROOT_TOKEN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=fastapi
      - POSTGRES_PASSWORD=${PG_PASS}
      - POSTGRES_DB=fastapi
      - MONGODB_URL=mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-change-me-mongo-pass}@mongo-episodic:27017,mongo-procedural:27017
      - MONGODB_HOST=mongo-episodic
      - MONGODB_PORT=27017
      - MONGODB_USERNAME=${MONGO_USER:-admin}
      - MONGODB_PASSWORD=${MONGO_PASS:-change-me-mongo-pass}
      - MONGODB_DATABASE=episodic
      - QDRANT_URL=http://qdrant:6333
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-secretpass}@rabbitmq:5672
      - LITELLM_URL=http://litellm:8000
      - AUTHENTIK_URL=https://authentik-server:9443
      - INSTANCE_ID=3
      - FASTAPI_OAUTH_CLIENT_ID=${FASTAPI_OAUTH_CLIENT_ID}
      - FASTAPI_OAUTH_CLIENT_SECRET=${FASTAPI_OAUTH_CLIENT_SECRET}
      - FASTAPI_OAUTH_REDIRECT_URI=${FASTAPI_OAUTH_REDIRECT_URI}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-secret-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - JWT_EXPIRATION_TIME=${JWT_EXPIRATION_TIME:-3600}
      - JWT_REFRESH_EXPIRATION_TIME=${JWT_REFRESH_EXPIRATION_TIME:-86400}
      - JWT_ISSUER=${JWT_ISSUER:-rag-system}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-rag-system-api}
      - OAUTH_SCOPE=${OAUTH_SCOPE:-openid email profile rag:api}
      - OAUTH_PROVIDER_URL=${OAUTH_PROVIDER_URL:-https://authentik-server:9443}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080,http://localhost:8000}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-localhost,127.0.0.1,*.localhost}
      - TZ=America/Chicago
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend_network
      - frontend_network
      - database_network
      - infrastructure_network

  # Worker for async tasks
  worker:
    build: ./services/workers
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://mongo-episodic:27017,mongo-procedural:27017
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-secretpass}@rabbitmq:5672
      - TZ=America/Chicago
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
    networks:
      - backend_network
      - database_network

  # LLM Proxy
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_API_BASE=http://ollama:11434
      - TZ=America/Chicago
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml
      - /etc/localtime:/etc/localtime:ro
    command: ["--config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  # Local LLM
  ollama:
    image: ollama/ollama:latest
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      TZ: America/Chicago
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_FLASH_ATTENTION: false
    volumes:
      - ollama_data:/root/.ollama
      - /etc/localtime:/etc/localtime:ro
    # Comment out GPU resources for testing without GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - backend_network

  # Databases
  mongo-episodic:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-change-me-mongo-pass}
      MONGO_INITDB_DATABASE: episodic
      TZ: America/Chicago
    volumes:
      - mongo_episodic:/data/db
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database_network

  mongo-procedural:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-change-me-mongo-pass}
      MONGO_INITDB_DATABASE: procedural
      TZ: America/Chicago
    volumes:
      - mongo_procedural:/data/db
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database_network

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      TZ: America/Chicago
    volumes:
      - qdrant_data:/qdrant/storage
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database_network

  clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
      TZ: America/Chicago
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8123:8123"
      - "9001:9000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database_network

  langfuse:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://langfuse:${PG_PASS:-secretpass}@postgres:5432/langfuse
      
      # ClickHouse for analytics
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
      
      # Redis for caching and queues
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ""
      
      # Authentication
      NEXTAUTH_URL: https://langfuse.${DOMAIN:-localhost}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse_secret_change_me}
      
      # Langfuse Configuration
      SALT: ${LANGFUSE_SALT:-langfuse_salt_change_me}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-langfuse_encryption_key_change_me}
      
      # Optional: Enable telemetry (set to false for privacy)
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: ${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-true}
      
      # Timezone
      TZ: America/Chicago
    volumes:
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.langfuse.rule=Host(`langfuse.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.langfuse.entrypoints=websecure"
      - "traefik.http.routers.langfuse.tls=true"
      - "traefik.http.services.langfuse.loadbalancer.server.port=3000"
    networks:
      - frontend_network
      - backend_network
      - database_network
      - monitoring_network

  # UI Applications
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      - OPENAI_API_BASE_URL=http://litellm:8000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_AUTH=false
      - TZ=America/Chicago
    volumes:
      - open_webui:/app/backend/data
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webui.rule=Host(`chat.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.webui.entrypoints=websecure"
      - "traefik.http.routers.webui.tls=true"
    networks:
      - frontend_network
      - backend_network

  # Scheduler
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASS:-secretpass}
      - N8N_HOST=n8n.${DOMAIN:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.${DOMAIN:-localhost}/
      - TZ=America/Chicago
    volumes:
      - n8n_data:/home/node/.n8n
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
    networks:
      - backend_network
      - frontend_network

  # LLM Observability
  healthchecks:
    image: healthchecks/healthchecks:latest
    restart: unless-stopped
    environment:
      - ALLOWED_HOSTS=*
      - DB=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=healthchecks
      - DB_USER=healthchecks
      - DB_PASSWORD=${PG_PASS:-secretpass}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=True
      - EMAIL_HOST_USER=${EMAIL_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_PASS}
      - SECRET_KEY=${HC_SECRET_KEY}
      - SITE_ROOT=https://health.${DOMAIN:-localhost}
      - TZ=America/Chicago
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.health.rule=Host(`health.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.health.entrypoints=websecure"
      - "traefik.http.routers.health.tls=true"
    networks:
      - monitoring_network
      - auth_network

  # Backup
  backrest:
    image: garethgeorge/backrest:latest
    restart: unless-stopped
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TZ=America/Chicago
    volumes:
      - ./config/backrest:/config
      - ./volumes/backups:/data
      - backrest_cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - mongo_episodic:/backup/mongo_episodic:ro
      - mongo_procedural:/backup/mongo_procedural:ro
      - qdrant_data:/backup/qdrant:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backrest.rule=Host(`backup.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.backrest.entrypoints=websecure"
      - "traefik.http.routers.backrest.tls=true"
    networks:
      - infrastructure_network
      - database_network

  # Secret Management
  vault:
    image: hashicorp/vault:1.15
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_ROOT_TOKEN:-vault-root-token}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://vault:8200
      - VAULT_LOG_LEVEL=info
      - TZ=America/Chicago
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./config/vault:/vault/config:ro
      - /etc/localtime:/etc/localtime:ro
    command: ["vault", "server", "-dev", "-dev-root-token-id=${VAULT_ROOT_TOKEN:-vault-root-token}"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vault.rule=Host(`vault.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.tls=true"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
    networks:
      - infrastructure_network
      - backend_network

  # Dashboard Service
  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    restart: unless-stopped
    ports:
      - "4001:8080"
    volumes:
      - ./config/dashy/conf.yml:/app/user-data/conf.yml:ro
      - dashy_data:/app/user-data/icons
    environment:
      - NODE_ENV=production
      - UID=1000
      - GID=1000
      - CONFIG_PATH=/app/user-data/conf.yml
    healthcheck:
      test: ["CMD", "node", "/app/services/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - monitoring_network
      - frontend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashy.rule=Host(`dashy.localhost`)"
      - "traefik.http.routers.dashy.entrypoints=web"
      - "traefik.http.services.dashy.loadbalancer.server.port=8080"
      - "traefik.docker.network=zoi_frontend"

volumes:
  authentik_media:
    name: authentik_media
  authentik_redis:
    name: authentik_redis
  authentik_templates:
    name: authentik_templates
  backrest_cache:
    name: backrest_cache
  clickhouse_data:
    name: clickhouse_data
  dashy_data:
    name: dashy_data
  mongo_episodic:
    name: mongo_episodic
  mongo_procedural:
    name: mongo_procedural
  n8n_data:
    name: n8n_data
  ollama_data:
    name: ollama_data
  open_webui:
    name: open_webui
  postgres_data:
    name: postgres_data
  qdrant_data:
    name: qdrant_data
  rabbitmq_data:
    name: rabbitmq_data
  redis_data:
    name: redis_data
  traefik_certs:
    name: traefik_certs
  vault_data:
    name: vault_data
  vault_logs:
    name: vault_logs

networks:
  # Frontend services network
  frontend_network:
    name: zoi_frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  
  # Backend services network  
  backend_network:
    name: zoi_backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  
  # Database services network
  database_network:
    name: zoi_database
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  
  # Authentication services network
  auth_network:
    name: zoi_auth
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
  
  # Monitoring services network
  monitoring_network:
    name: zoi_monitoring
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24
  
  # Infrastructure services network (Traefik, Vault, etc.)
  infrastructure_network:
    name: zoi_infrastructure
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24

  # Legacy default network for backward compatibility
  default:
    name: rag_network
