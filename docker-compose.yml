services:
  # PostgreSQL Database for Authentik
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:-secretpass}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      TZ: America/Chicago
      # Initialize multiple databases
      POSTGRES_MULTIPLE_DATABASES: authentik,fastapi,healthchecks,superagi
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth_network
      - backend_network
      - database_network

  # Authentication
  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    restart: unless-stopped
    command: server
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./config/authentik/blueprints:/blueprints/custom:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
      - ./config/authentik/.env
    ports:
      - "9000:9000"
      - "9443:9443"
    depends_on:
      - postgres
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`auth.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      start_period: 30s
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - auth_network
      - frontend_network
      - backend_network

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    restart: unless-stopped
    command: worker
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./config/authentik/blueprints:/blueprints/custom:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
      - ./config/authentik/.env
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      start_period: 30s
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - auth_network
      - backend_network

  # Reverse Proxy
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard port
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/configuration/dynamic:ro
      - ./config/traefik/certs:/certs:ro
      - traefik_certs:/letsencrypt
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL}
      - TZ=America/Chicago
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@file"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frontend_network
      - backend_network
      - infrastructure_network

  # Cache Layer
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      TZ: America/Chicago
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network
      - database_network

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    ports:
      - "8002:8001"
    environment:
      TZ: America/Chicago
    volumes:
      - redis_insight_data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis.rule=Host(`redis.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.redis.entrypoints=websecure"
      - "traefik.http.routers.redis.tls.certresolver=letsencrypt"
      - "traefik.http.services.redis.loadbalancer.server.port=8001"
    networks:
      - backend_network
      - monitoring_network

  # Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-secretpass}
      TZ: America/Chicago
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.rabbitmq.entrypoints=websecure"
      - "traefik.http.routers.rabbitmq.tls.certresolver=letsencrypt"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"
    networks:
      - backend_network

  # API Backend
  fastapi-1: &fastapi
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
      - ./config/fastapi/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.services.api.loadbalancer.sticky.cookie=true"
    networks:
      - backend_network
      - frontend_network
      - database_network
      - infrastructure_network

  # Worker for async tasks
  worker:
    build: ./services/workers
    restart: unless-stopped
    env_file:
      - .env
      - ./config/fastapi/.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    networks:
      - backend_network
      - database_network

  # LLM Proxy
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_API_BASE=http://ollama:11434
      - TZ=America/Chicago
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml
      - /etc/localtime:/etc/localtime:ro
    command: ["--config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  # Local LLM
  ollama:
    image: ollama/ollama:latest
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      TZ: America/Chicago
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ollama_data:/root/.ollama
      - /etc/localtime:/etc/localtime:ro
    # Comment out GPU resources for testing without GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - backend_network

  # Databases
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-change-me-mongo-pass}
      TZ: America/Chicago
    volumes:
      - mongo_data:/data/db
      - ./config/mongodb/init-multiple-databases.js:/docker-entrypoint-initdb.d/init-multiple-databases.js:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database_network

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      TZ: America/Chicago
    volumes:
      - qdrant_data:/qdrant/storage
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qdrant.rule=Host(`qdrant.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.qdrant.entrypoints=websecure"
      - "traefik.http.routers.qdrant.tls.certresolver=letsencrypt"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"
    networks:
      - database_network
      - frontend_network

  # UI Applications
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      - OPENAI_API_BASE_URL=http://litellm:8000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_AUTH=false
      - TZ=America/Chicago
    volumes:
      - open_webui:/app/backend/data
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webui.rule=Host(`webui.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.webui.entrypoints=websecure"
      - "traefik.http.routers.webui.tls.certresolver=letsencrypt"
      - "traefik.http.services.webui.loadbalancer.server.port=8080"
    networks:
      - frontend_network
      - backend_network

  # Scheduler
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    env_file:
      - .env
      - ./config/n8n/.env
    volumes:
      - n8n_data:/home/node/.n8n
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
    networks:
      - backend_network
      - frontend_network

  # LLM Observability
  healthchecks:
    image: healthchecks/healthchecks:latest
    restart: unless-stopped
    environment:
      - ALLOWED_HOSTS=*
      - DB=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=healthchecks
      - DB_USER=healthchecks
      - DB_PASSWORD=${PG_PASS}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=True
      - EMAIL_HOST_USER=${EMAIL_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_PASS}
      - SECRET_KEY=${HC_SECRET_KEY}
      - SITE_ROOT=https://health.${DOMAIN:-localhost}
      - TZ=America/Chicago
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.health.rule=Host(`health.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.health.entrypoints=websecure"
      - "traefik.http.routers.health.tls=true"
    networks:
      - monitoring_network
      - auth_network

  # Backup
  backrest:
    image: garethgeorge/backrest:latest
    restart: unless-stopped
    ports:
      - "9898:9898"
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TZ=America/Chicago
    volumes:
      - ./config/backrest:/config
      - ./volumes/backups:/data
      - backrest_cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - mongo_data:/backup/mongo:ro
      - qdrant_data:/backup/qdrant:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backrest.rule=Host(`backup.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.backrest.entrypoints=websecure"
      - "traefik.http.routers.backrest.tls=true"
    networks:
      - infrastructure_network
      - database_network

  # Dashboard Service
  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    restart: unless-stopped
    ports:
      - "4001:8080"
    volumes:
      - ./config/dashy/conf.yml:/app/user-data/conf.yml:ro
      - dashy_data:/app/user-data/icons
    environment:
      - NODE_ENV=production
      - UID=1000
      - GID=1000
      - CONFIG_PATH=/app/user-data/conf.yml
    healthcheck:
      test: ["CMD", "node", "/app/services/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - monitoring_network
      - frontend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashy.rule=Host(`dashy.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.dashy.entrypoints=websecure"
      - "traefik.http.routers.dashy.tls=true"
      - "traefik.http.services.dashy.loadbalancer.server.port=8080"
      - "traefik.docker.network=zoi_frontend"

  # SuperAGI - Autonomous AI Agent Framework
  superagi-backend:
    image: superagi/backend:latest
    build:
      context: ./superagi
      dockerfile: Dockerfile
    container_name: superagi-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
      - ./config/superagi/.env
    volumes:
      - superagi_data:/app/data
      - ./superagi:/app:rw
      - ./config/superagi/config.yaml:/app/config.yaml:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - postgres
      - redis
    networks:
      - backend_network
      - database_network
    command: ["/app/wait-for-it.sh", "postgres:5432", "-t", "60", "--", "/app/entrypoint.sh"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.superagi-api.rule=Host(`agi.${DOMAIN:-localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.superagi-api.entrypoints=websecure"
      - "traefik.http.routers.superagi-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.superagi-api.service=superagi-backend"
      - "traefik.http.services.superagi-backend.loadbalancer.server.port=8001"
      - "traefik.docker.network=zoi_frontend_network"
      - "traefik.http.routers.superagi-api-local.rule=Host(`localhost`) && PathPrefix(`/api`) && Port(`8001`)"
      - "traefik.http.routers.superagi-api-local.entrypoints=web"
      - "traefik.http.routers.superagi-api-local.service=superagi-backend"

  superagi-celery:
    image: superagi/backend:latest
    build:
      context: ./superagi
      dockerfile: Dockerfile
    container_name: superagi-celery
    restart: unless-stopped
    env_file:
      - .env
      - ./config/superagi/.env
    volumes:
      - superagi_data:/app/data
      - ./superagi:/app:rw
      - ./config/superagi/config.yaml:/app/config.yaml:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - postgres
      - redis
    networks:
      - backend_network
      - database_network
    command: ["/app/wait-for-it.sh", "postgres:5432", "-t", "60", "--", "/app/entrypoint_celery.sh"]

  superagi-gui:
    image: superagi/gui:latest
    build:
      context: ./superagi/gui
      dockerfile: Dockerfile
    container_name: superagi-gui
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8001
      - TZ=America/Chicago
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - superagi-backend
    networks:
      - frontend_network
      - backend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.superagi-frontend.rule=Host(`agi.${DOMAIN:-localhost}`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.superagi-frontend.entrypoints=websecure"
      - "traefik.http.routers.superagi-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.superagi-frontend.service=superagi-frontend"
      - "traefik.http.services.superagi-frontend.loadbalancer.server.port=3000"
      - "traefik.docker.network=zoi_frontend_network"
      - "traefik.http.routers.superagi-local.rule=Host(`localhost`) && Port(`3001`)"
      - "traefik.http.routers.superagi-local.entrypoints=web"
      - "traefik.http.routers.superagi-local.service=superagi-frontend"

volumes:
  authentik_media:
    name: authentik_media
  authentik_templates:
    name: authentik_templates
  backrest_cache:
    name: backrest_cache
  dashy_data:
    name: dashy_data
  mongo_data:
    name: mongo_data
  n8n_data:
    name: n8n_data
  ollama_data:
    name: ollama_data
  open_webui:
    name: open_webui
  postgres_data:
    name: postgres_data
  qdrant_data:
    name: qdrant_data
  rabbitmq_data:
    name: rabbitmq_data
  redis_data:
    name: redis_data
  redis_insight_data:
    name: redis_insight_data
  superagi_data:
    name: superagi_data
  traefik_certs:
    name: traefik_certs

networks:
  # Frontend services network
  frontend_network:
    name: zoi_frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  
  # Backend services network  
  backend_network:
    name: zoi_backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  
  # Database services network
  database_network:
    name: zoi_database
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  
  # Authentication services network
  auth_network:
    name: zoi_auth
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
  
  # Monitoring services network
  monitoring_network:
    name: zoi_monitoring
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24
  
  # Infrastructure services network (Traefik, etc.)
  infrastructure_network:
    name: zoi_infrastructure
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24

  # Legacy default network for backward compatibility
  default:
    name: rag_network
  app_network:
    name: zoi_app
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/24
