# Zoi Ecosystem - Stack Orchestrator
# This file orchestrates all service stacks using Docker Compose include functionality

include:
  # Core Infrastructure & AI Services
  - path: ./apps/llm-local/docker-compose.yml
    project_directory: ./apps/llm-local

  # Platform Services (Traefik, Authentik, Databases)
  - path: ./apps/platform/docker-compose.yml
    project_directory: ./apps/platform

  # Productivity Tools (n8n, OpenWebUI, LobeChat)
  - path: ./apps/tools/docker-compose.yml
    project_directory: ./apps/tools

  # Knowledge Management (Archon MCP)
  - path: ./apps/archon-mcp/docker-compose.yml
    project_directory: ./apps/archon-mcp

  # Monitoring & Observability
  - path: ./apps/monitor/docker-compose.yml
    project_directory: ./apps/monitor


# Unified network architecture
networks:
  zoi-network:
    name: zoi-network
    external: true
