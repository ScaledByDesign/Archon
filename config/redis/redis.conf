# Redis Configuration
# Basic configuration for Redis server

# Network
bind 0.0.0.0
port 6379

# Security
requirepass change-me-redis-pass

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice

# Other settings
timeout 0
tcp-keepalive 300
