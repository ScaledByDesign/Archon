# Redis Bootstrap Configuration for Zoi Ecosystem
# Optimized for AI/ML workloads and multi-service architecture

# ==============================================
# NETWORK & SECURITY
# ==============================================
bind 0.0.0.0
port 6379
protected-mode no
tcp-keepalive 300
timeout 0

# ==============================================
# MEMORY MANAGEMENT (Optimized for AI workloads)
# ==============================================
maxmemory 1gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# ==============================================
# PERSISTENCE (Balanced for performance & durability)
# ==============================================
# RDB snapshots
save 900 1
save 300 10
save 60 10000

# AOF (Append Only File) for better durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ==============================================
# PERFORMANCE TUNING
# ==============================================
# TCP backlog
tcp-backlog 511

# Client connections
maxclients 10000

# Lazy freeing (non-blocking deletion)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ==============================================
# LOGGING
# ==============================================
loglevel notice
logfile ""
syslog-enabled no

# ==============================================
# DATABASE PARTITIONING FOR ZOI SERVICES
# ==============================================
databases 16

# Database allocation:
# DB 0: Default/General cache
# DB 1: LiteLLM cache
# DB 2: Authentik sessions
# DB 3: Langfuse cache
# DB 4: n8n workflow cache
# DB 5: OpenWebUI cache
# DB 6: LobeChat cache
# DB 7: SearXNG cache
# DB 8: Monitoring/metrics
# DB 9: Rate limiting
# DB 10-15: Reserved for future services

# ==============================================
# MODULES & EXTENSIONS
# ==============================================
# Enable keyspace notifications for monitoring
notify-keyspace-events Ex

# ==============================================
# SLOW LOG (for performance monitoring)
# ==============================================
slowlog-log-slower-than 10000
slowlog-max-len 128

# ==============================================
# CLIENT OUTPUT BUFFER LIMITS
# ==============================================
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ==============================================
# HASH & LIST OPTIMIZATIONS
# ==============================================
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# ==============================================
# REPLICATION (for future HA setup)
# ==============================================
# replica-serve-stale-data yes
# replica-read-only yes
# repl-diskless-sync no
# repl-diskless-sync-delay 5

# ==============================================
# SECURITY ENHANCEMENTS
# ==============================================
# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""
# rename-command CONFIG ""
# rename-command SHUTDOWN SHUTDOWN_ZOI_2024

# ==============================================
# MEMORY USAGE OPTIMIZATION
# ==============================================
# Use jemalloc for better memory management
# (This is typically set at compile time)

# Active rehashing
activerehashing yes

# ==============================================
# MONITORING & METRICS
# ==============================================
# Enable latency monitoring
latency-monitor-threshold 100

# ==============================================
# CLUSTER CONFIGURATION (for future scaling)
# ==============================================
# cluster-enabled no
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 15000
