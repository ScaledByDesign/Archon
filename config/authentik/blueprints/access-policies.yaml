version: 1
metadata:
  name: Access Control Policies
entries:
  # Policy for Admin Access
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: admin-access-policy
    attrs:
      name: admin-access-policy
      expression: |
        # Check if user is superuser or in admins group
        if user.is_superuser:
            return True
        
        # Check if user is in admins group
        for group in user.ak_groups.all():
            if group.name == "admins":
                return True
        
        return False
      execution_logging: true

  # Policy for User Access (any authenticated user)
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: user-access-policy
    attrs:
      name: user-access-policy
      expression: |
        # Allow any authenticated user
        return user.is_authenticated
      execution_logging: true

  # Policy for API Access (requires specific group)
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: api-access-policy
    attrs:
      name: api-access-policy
      expression: |
        # Check if user has API access
        if user.is_superuser:
            return True
            
        allowed_groups = ["admins", "users", "api-users"]
        for group in user.ak_groups.all():
            if group.name in allowed_groups:
                return True
        
        return False
      execution_logging: true

  # Policy for Workflow Access (admins only initially)
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: workflow-access-policy
    attrs:
      name: workflow-access-policy
      expression: |
        # Only allow admins to access workflows initially
        if user.is_superuser:
            return True
            
        for group in user.ak_groups.all():
            if group.name == "admins":
                return True
        
        return False
      execution_logging: true

  # Application Policy Bindings
  # FastAPI - API Access Policy
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, "fastapi"]]
      policy: !KeyOf api-access-policy
    attrs:
      target: !Find [authentik_core.application, [slug, "fastapi"]]
      policy: !KeyOf api-access-policy
      enabled: true
      order: 0
      timeout: 30

  # Open WebUI - User Access Policy
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, "webui"]]
      policy: !KeyOf user-access-policy
    attrs:
      target: !Find [authentik_core.application, [slug, "webui"]]
      policy: !KeyOf user-access-policy
      enabled: true
      order: 0
      timeout: 30

  # n8n - Workflow Access Policy
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, "n8n"]]
      policy: !KeyOf workflow-access-policy
    attrs:
      target: !Find [authentik_core.application, [slug, "n8n"]]
      policy: !KeyOf workflow-access-policy
      enabled: true
      order: 0
      timeout: 30

  # Traefik Dashboard - Admin Access Policy
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, "traefik-dashboard"]]
      policy: !KeyOf admin-access-policy
    attrs:
      target: !Find [authentik_core.application, [slug, "traefik-dashboard"]]
      policy: !KeyOf admin-access-policy
      enabled: true
      order: 0
      timeout: 30

  # RabbitMQ Management - Admin Access Policy
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, "rabbitmq-management"]]
      policy: !KeyOf admin-access-policy
    attrs:
      target: !Find [authentik_core.application, [slug, "rabbitmq-management"]]
      policy: !KeyOf admin-access-policy
      enabled: true
      order: 0
      timeout: 30

  # Redis Insight - Admin Access Policy
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, "redis-insight"]]
      policy: !KeyOf admin-access-policy
    attrs:
      target: !Find [authentik_core.application, [slug, "redis-insight"]]
      policy: !KeyOf admin-access-policy
      enabled: true
      order: 0
      timeout: 30
