version: 1
metadata:
  name: Traefik Forward Authentication Provider
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context:
  traefik_domain: !Env [DOMAIN, "zoi.local"]
entries:
# Create Forward Auth Provider with clean configuration
- model: authentik_providers_proxy.proxyprovider
  identifiers:
    name: traefik-forward-auth
  attrs:
    name: traefik-forward-auth
    authorization_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
    mode: forward_domain
    external_host: !Format [http://auth.%s, !Context traefik_domain]
    cookie_domain: !Context traefik_domain
    # Clean redirect configuration - minimal URL exposure
    skip_path_regex: ^/static/.*|^/media/.*|^/favicon\.ico$|^/api/.*
    internal_host: http://authentik-server:9000
    internal_host_ssl_validation: false
    # Minimize token exposure
    access_token_validity: minutes=5
    refresh_token_validity: days=1

# Create Application for Traefik Forward Auth with minimal metadata
- model: authentik_core.application
  identifiers:
    slug: traefik-forward-auth
  attrs:
    name: Traefik Forward Auth
    slug: traefik-forward-auth
    provider: !Find [authentik_providers_proxy.proxyprovider, [name, traefik-forward-auth]]
    meta_launch_url: blank://blank
    meta_description: Forward authentication
    meta_publisher: ""
    policy_engine_mode: any
    open_in_new_tab: false

# Create a basic access policy for authenticated users
- model: authentik_policies_expression.expressionpolicy
  identifiers:
    name: dashy-access-policy
  attrs:
    name: dashy-access-policy
    expression: |
      # Allow access for authenticated users in admin group or any authenticated user
      return ak_is_group_member(request.user, name="authentik Admins") or request.user.is_authenticated

# Bind the policy to the application
- model: authentik_policies.policybinding
  identifiers:
    target: !Find [authentik_core.application, [slug, traefik-forward-auth]]
    policy: !Find [authentik_policies_expression.expressionpolicy, [name, dashy-access-policy]]
  attrs:
    target: !Find [authentik_core.application, [slug, traefik-forward-auth]]
    policy: !Find [authentik_policies_expression.expressionpolicy, [name, dashy-access-policy]]
    order: 0
    enabled: true

# Assign provider to embedded outpost for forward authentication
- model: authentik_outposts.outpost
  identifiers:
    name: authentik Embedded Outpost
  attrs:
    name: authentik Embedded Outpost
    type: proxy
    providers:
      - !Find [authentik_providers_proxy.proxyprovider, [name, traefik-forward-auth]]
