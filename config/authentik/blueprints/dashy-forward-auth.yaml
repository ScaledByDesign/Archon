# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: dashy-forward-auth
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: "Production-ready Traefik Forward-Auth protection for Dashy dashboard"
context: {}
entries:
  # Create Proxy Provider for Dashy Forward Auth
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: Dashy Forward Auth
    attrs:
      name: Dashy Forward Auth
      mode: forward_single
      external_host: http://dashy.zoi.local
      # Use the default authentication and invalidation flows
      authorization_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]

  # Create Application linked to the proxy provider
  - model: authentik_core.application
    state: present
    identifiers:
      slug: dashy-forward-auth-app
    attrs:
      name: Dashy Forward Auth App
      slug: dashy-forward-auth-app
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, Dashy Forward Auth]]
      launch_url: "blank://blank"

  # Bind the proxy provider to the embedded outpost
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: Embedded Outpost
    attrs:
      name: Authentik Embedded Outpost
      type: proxy
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, Dashy Forward Auth]]