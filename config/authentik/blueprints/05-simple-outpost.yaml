# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: dashy-05-simple-outpost
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: "Step 5: Simple outpost configuration using defaults"
context: {}
entries:
  # Update embedded outpost to include our provider (using defaults, no custom policies)
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [external_host, http://dashy.zoi.local]]
      config:
        authentik_host: !Env [AUTHENTIK_HOST, http://authentik-server:9000]
        authentik_host_insecure: true
