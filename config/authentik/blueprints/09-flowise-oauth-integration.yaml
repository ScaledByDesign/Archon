version: 1
metadata:
  name: 09-flowise-oauth-integration
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context:
  flowise_client_id: flowise-oauth-client
  flowise_client_secret: change-me-flowise-oauth-secret
entries:
  # OAuth2 Provider for Flowise
  - identifiers:
      pk: flowise-oauth-provider
    model: authentik_providers_oauth2.oauth2provider
    attrs:
      name: Flowise OAuth2 Provider
      client_type: confidential
      client_id: !Context flowise_client_id
      client_secret: !Context flowise_client_secret
      authorization_grant_type: authorization-code
      redirect_uris: |
        http://flowise.zoi.local/api/v1/oauth/callback
        http://flowise.zoi.local/oauth/callback
      signing_key: !KeyOf authentik_crypto.certificatekeypair "authentik Self-signed Certificate"
      access_token_validity: hours=24
      refresh_token_validity: days=30
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: hashed_user_id

  # Forward Auth Provider for Flowise
  - identifiers:
      pk: flowise-forward-auth-provider
    model: authentik_providers_proxy.proxyprovider
    attrs:
      name: Flowise Forward Auth Provider
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      mode: forward_single
      external_host: http://flowise.zoi.local
      cookie_domain: .zoi.local
      token_validity: hours=24
      skip_path_regex: ^/(api|webhook)/.*$

  # Flowise OAuth2 Application
  - identifiers:
      pk: flowise-oauth-app
    model: authentik_core.application
    attrs:
      name: Flowise OAuth2
      slug: flowise-oauth
      provider: !KeyOf authentik_providers_oauth2.oauth2provider flowise-oauth-provider
      policy_engine_mode: any
      meta_launch_url: http://flowise.zoi.local
      meta_description: Flowise AI Workflow Builder - OAuth2 Integration
      meta_publisher: Zoi Infrastructure
      meta_icon: https://raw.githubusercontent.com/FlowiseAI/Flowise/main/packages/ui/public/favicon.ico

  # Flowise Forward Auth Application
  - identifiers:
      pk: flowise-forward-auth-app
    model: authentik_core.application
    attrs:
      name: Flowise Forward Auth
      slug: flowise-forward-auth
      provider: !KeyOf authentik_providers_proxy.proxyprovider flowise-forward-auth-provider
      policy_engine_mode: any
      meta_launch_url: http://flowise.zoi.local
      meta_description: Flowise AI Workflow Builder - Forward Auth
      meta_publisher: Zoi Infrastructure
      meta_icon: https://raw.githubusercontent.com/FlowiseAI/Flowise/main/packages/ui/public/favicon.ico

  # Policy Binding for Flowise OAuth2
  - identifiers:
      pk: flowise-oauth-policy-binding
    model: authentik_policies.policybinding
    attrs:
      target: !KeyOf authentik_core.application flowise-oauth-app
      group: !Find [authentik_core.group, [name, zoi-users]]
      order: 0
      enabled: true

  # Policy Binding for Flowise Forward Auth
  - identifiers:
      pk: flowise-forward-auth-policy-binding
    model: authentik_policies.policybinding
    attrs:
      target: !KeyOf authentik_core.application flowise-forward-auth-app
      group: !Find [authentik_core.group, [name, zoi-users]]
      order: 0
      enabled: true

  # Add Flowise Forward Auth Provider to Embedded Outpost
  - identifiers:
      pk: embedded-outpost-flowise-provider
    model: authentik_outposts.outpost
    state: present
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !KeyOf authentik_providers_proxy.proxyprovider dashy-forward-auth-provider
        - !KeyOf authentik_providers_proxy.proxyprovider n8n-forward-auth-provider
        - !KeyOf authentik_providers_proxy.proxyprovider openwebui-forward-auth-provider
        - !KeyOf authentik_providers_proxy.proxyprovider litellm-forward-auth-provider
        - !KeyOf authentik_providers_proxy.proxyprovider flowise-forward-auth-provider
