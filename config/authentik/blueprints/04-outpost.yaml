# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: dashy-04-outpost
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: "Step 4: Bind provider to embedded outpost"
context: {}
entries:
  # Update embedded outpost to include our provider
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, Dashy Forward Auth]]
      config:
        authentik_host: !Env [AUTHENTIK_HOST, http://dashy.zoi.local]
        authentik_host_insecure: true