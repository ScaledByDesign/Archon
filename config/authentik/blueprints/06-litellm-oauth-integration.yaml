# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: 06-litellm-oauth-integration
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: "Step 6: LiteLLM OAuth2/OIDC Provider for API access with JWT authentication"
context: {}
entries:
  # OAuth2/OIDC Provider for LiteLLM API access
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: LiteLLM OAuth2 Provider
    attrs:
      name: "LiteLLM OAuth2 Provider"
      client_type: confidential
      client_id: "litellm-oauth-client"
      client_secret: !Env [LITELLM_OAUTH_CLIENT_SECRET, "litellm-secret-change-me"]
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-explicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-invalidation-flow"]]
      
      # Redirect URIs for LiteLLM SSO callback
      redirect_uris:
        - "http://llm.zoi.local/sso/callback"
        - "https://llm.zoi.local/sso/callback"
      
      # JWT Configuration for API access
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      access_token_validity: hours=1
      refresh_token_validity: days=7
      
      # Scopes for API access
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

  # Forward Auth Provider for UI access (using same domain pattern as Dashy)
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: LiteLLM Forward Auth
    attrs:
      name: "LiteLLM Forward Auth"
      mode: forward_domain
      external_host: http://llm.zoi.local
      internal_host: http://litellm:4000
      cookie_domain: zoi.local
      skip_path_regex: ^/v1/.*$  # Skip API paths for OAuth2
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-explicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-invalidation-flow"]]

  # OAuth2 Application for API access
  - model: authentik_core.application
    state: present
    identifiers:
      slug: litellm-oauth-app
    attrs:
      name: LiteLLM API
      slug: litellm-oauth-app
      group: zoi-users  # Use existing group from 01-users.yaml
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "LiteLLM OAuth2 Provider"]]
      launch_url: http://llm.zoi.local
      meta_description: "LiteLLM API OAuth2 Access"
      meta_publisher: "Zoi System"

  # Forward Auth Application for UI access  
  - model: authentik_core.application
    state: present
    identifiers:
      slug: litellm-forward-auth-app
    attrs:
      name: LiteLLM UI
      slug: litellm-forward-auth-app
      group: zoi-users  # Use existing group from 01-users.yaml
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "LiteLLM Forward Auth"]]
      launch_url: http://llm.zoi.local
      meta_description: "LiteLLM Web UI Forward Auth Access"
      meta_publisher: "Zoi System"

  # Access policy for LiteLLM (reuse zoi-users group)
  - model: authentik_policies_expression.expressionpolicy
    state: present
    identifiers:
      name: litellm-access-policy
    attrs:
      name: litellm-access-policy
      expression: 'return "zoi-users" in [group.name for group in request.user.ak_groups.all()]'
      execution_logging: false

  # Bind policy to OAuth application
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, litellm-access-policy]]
      target: !Find [authentik_core.application, [slug, litellm-oauth-app]]
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, litellm-access-policy]]
      target: !Find [authentik_core.application, [slug, litellm-oauth-app]]
      enabled: true
      order: 0
      timeout: 30

  # Bind policy to Forward Auth application
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, litellm-access-policy]]
      target: !Find [authentik_core.application, [slug, litellm-forward-auth-app]]
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, litellm-access-policy]]
      target: !Find [authentik_core.application, [slug, litellm-forward-auth-app]]
      enabled: true
      order: 0
      timeout: 30

  # Update embedded outpost to include LiteLLM providers
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: "authentik Embedded Outpost"
    attrs:
      name: "authentik Embedded Outpost"
      type: proxy
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, "Dashy Forward Auth"]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, "LiteLLM Forward Auth"]]
      config:
        authentik_host: http://auth.zoi.local
        authentik_host_insecure: true
        log_level: info
