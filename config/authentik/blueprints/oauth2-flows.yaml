version: 1
metadata:
  name: OAuth2 and OIDC Flows
entries:
  # Authorization Flow for OAuth2
  - model: authentik_flows.flow
    identifiers:
      slug: default-authorization-flow
    attrs:
      name: Default Authorization Flow
      title: Welcome to Authentik!
      slug: default-authorization-flow
      designation: authorization
      policy_engine_mode: any
      compatibility_mode: false

  # Authentication Flow for Login
  - model: authentik_flows.flow
    identifiers:
      slug: default-authentication-flow
    attrs:
      name: Default Authentication Flow
      title: Welcome back!
      slug: default-authentication-flow
      designation: authentication
      policy_engine_mode: any
      compatibility_mode: false

  # Invalidation Flow for Logout
  - model: authentik_flows.flow
    identifiers:
      slug: default-invalidation-flow
    attrs:
      name: Default Invalidation Flow
      title: Goodbye!
      slug: default-invalidation-flow
      designation: invalidation
      policy_engine_mode: any
      compatibility_mode: false

  # User Settings Flow
  - model: authentik_flows.flow
    identifiers:
      slug: default-user-settings-flow
    attrs:
      name: Default User Settings Flow
      title: Update your info
      slug: default-user-settings-flow
      designation: stage_configuration
      policy_engine_mode: any
      compatibility_mode: false

  # Authentication Stage
  - model: authentik_stages_password.passwordstage
    identifiers:
      name: default-authentication-password
    attrs:
      name: default-authentication-password
      backends:
        - authentik.core.auth.InbuiltBackend
        - authentik.sources.ldap.auth.LDAPBackend
      configure_flow: !KeyOf default-user-settings-flow
      failed_attempts_before_cancel: 5

  # Authorization Stage
  - model: authentik_stages_consent.consentstage
    identifiers:
      name: default-authorization-consent
    attrs:
      name: default-authorization-consent
      mode: always_require

  # User Login Stage
  - model: authentik_stages_user_login.userloginstage
    identifiers:
      name: default-authentication-login
    attrs:
      name: default-authentication-login
      session_duration: 0

  # User Logout Stage
  - model: authentik_stages_user_logout.userlogoutstage
    identifiers:
      name: default-invalidation-logout
    attrs:
      name: default-invalidation-logout

  # Bind Authentication Password Stage to Flow
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf default-authentication-flow
      stage: !KeyOf default-authentication-password
      order: 10
    attrs:
      target: !KeyOf default-authentication-flow
      stage: !KeyOf default-authentication-password
      evaluate_on_plan: true
      re_evaluate_policies: true
      order: 10

  # Bind Authentication Login Stage to Flow
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf default-authentication-flow
      stage: !KeyOf default-authentication-login
      order: 20
    attrs:
      target: !KeyOf default-authentication-flow
      stage: !KeyOf default-authentication-login
      evaluate_on_plan: true
      re_evaluate_policies: true
      order: 20

  # Bind Authorization Consent Stage to Flow
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf default-authorization-flow
      stage: !KeyOf default-authorization-consent
      order: 10
    attrs:
      target: !KeyOf default-authorization-flow
      stage: !KeyOf default-authorization-consent
      evaluate_on_plan: true
      re_evaluate_policies: true
      order: 10

  # Bind Invalidation Logout Stage to Flow
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf default-invalidation-flow
      stage: !KeyOf default-invalidation-logout
      order: 10
    attrs:
      target: !KeyOf default-invalidation-flow
      stage: !KeyOf default-invalidation-logout
      evaluate_on_plan: true
      re_evaluate_policies: true
      order: 10
