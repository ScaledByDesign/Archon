# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: dashy-03-policies
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: "Step 3: Create policies and bindings"
context: {}
entries:
  # Add user to group first
  - model: authentik_core.user
    state: present
    identifiers:
      username: testuser
    attrs:
      username: testuser
      name: Test User
      email: test@zoi.local
      is_active: true
      password: !Env [AUTHENTIK_TEST_PASSWORD, TestPassword123!]
      groups:
        - !Find [authentik_core.group, [name, dashy-users]]

  # Create access policy
  - model: authentik_policies.grouppolicy
    state: present
    identifiers:
      name: dashy-access-policy
    attrs:
      name: dashy-access-policy
      groups:
        - !Find [authentik_core.group, [name, dashy-users]]

  # Bind policy to application
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, dashy-forward-auth-app]]
      policy: !Find [authentik_policies.grouppolicy, [name, dashy-access-policy]]
    attrs:
      target: !Find [authentik_core.application, [slug, dashy-forward-auth-app]]
      policy: !Find [authentik_policies.grouppolicy, [name, dashy-access-policy]]
      enabled: true
      order: 0