# JWT Security Configuration for Authentik
# This file defines the JWT security settings for the Production RAG System

# Token Lifetimes (in seconds)
token_lifetimes:
  access_token: 3600      # 1 hour
  refresh_token: 86400    # 24 hours  
  id_token: 3600          # 1 hour
  authorization_code: 300 # 5 minutes

# Signing Configuration
signing:
  algorithm: "RS256"
  key_rotation_interval: 2592000  # 30 days in seconds
  key_size: 2048

# Security Settings
security:
  clock_skew_tolerance: 30        # seconds
  max_auth_age: 86400            # 24 hours
  require_pkce: true             # Proof Key for Code Exchange
  require_state: true            # OAuth2 state parameter
  strict_redirect_matching: true # Exact redirect URI matching

# Audience and Issuer
oauth2:
  issuer: "https://auth.localhost/application/o/default/"
  default_audience: "rag-system"
  
# Scopes Definition
scopes:
  openid:
    description: "OpenID Connect authentication"
    claims:
      - "sub"
      - "iss"
      - "aud"
      - "exp"
      - "iat"
      - "auth_time"
      
  profile:
    description: "User profile information"
    claims:
      - "name"
      - "preferred_username"
      - "given_name"
      - "family_name"
      - "picture"
      - "locale"
      
  email:
    description: "User email information"
    claims:
      - "email"
      - "email_verified"
      
  groups:
    description: "User group membership"
    claims:
      - "groups"
      
  rag:api:
    description: "RAG API access"
    claims:
      - "api_access"
      
  rag:search:
    description: "RAG search functionality"
    claims:
      - "search_access"
      
  rag:write:
    description: "RAG write operations"
    claims:
      - "write_access"
      
  admin:
    description: "Administrative access"
    claims:
      - "admin_access"
      - "all_permissions"

# Claims Mapping
claims_mapping:
  sub: "user.uuid"
  preferred_username: "user.username"
  name: "user.name"
  given_name: "user.first_name"
  family_name: "user.last_name"
  email: "user.email"
  email_verified: "user.email_verified"
  groups: "user.ak_groups.all|list"
  picture: "user.avatar"
  locale: "user.locale"

# Session Management
session:
  max_concurrent_sessions: 5
  session_timeout: 3600           # 1 hour
  remember_me_duration: 2592000   # 30 days
  
# Rate Limiting
rate_limiting:
  token_requests_per_minute: 60
  failed_attempts_threshold: 5
  lockout_duration: 900          # 15 minutes

# Validation Rules
validation:
  require_exp: true
  require_iat: true
  require_nbf: false
  verify_signature: true
  verify_audience: true
  verify_issuer: true
  
# Logging and Monitoring
logging:
  log_token_validation: true
  log_failed_attempts: true
  log_successful_auth: true
  log_token_refresh: true
  
# Security Headers
security_headers:
  strict_transport_security: "max-age=31536000; includeSubDomains"
  content_security_policy: "default-src 'self'"
  x_frame_options: "DENY"
  x_content_type_options: "nosniff"
  referrer_policy: "strict-origin-when-cross-origin"

# CORS Configuration
cors:
  allowed_origins:
    - "http://localhost:8000"
    - "https://localhost:8000"
    - "http://localhost:3000"
    - "https://localhost:3000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Authorization"
    - "Content-Type"
    - "X-Requested-With"
  expose_headers:
    - "X-Total-Count"
  allow_credentials: true
  max_age: 86400

# Development vs Production Settings
environment_overrides:
  development:
    clock_skew_tolerance: 60
    token_lifetimes:
      access_token: 7200    # 2 hours for development
    security:
      require_pkce: false   # Relaxed for development
      
  production:
    clock_skew_tolerance: 10
    security:
      require_pkce: true
      strict_redirect_matching: true
    rate_limiting:
      token_requests_per_minute: 30
      failed_attempts_threshold: 3
