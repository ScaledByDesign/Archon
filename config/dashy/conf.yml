# dashy/conf.yml

pageInfo:
  title: 'Zoi Production Dashboard'
  description: 'Central console for Zoi stack—APIs, infra, AI, automation'
  logo: '/assets/zoi-logo.svg'
  footerText: '🚀 Zoi v2.0 • Maintained by DevOps'

appConfig:
  theme: 'nord-frost'
  layout: 'auto'
  iconSize: 'medium'
  language: 'en'
  startingView: 'default'
  defaultOpeningMethod: 'newtab'
  statusCheck: true
  statusCheckInterval: 30
  enableSearch: true
  allowConfigEdit: false
  staticCaching: true

  # ─── Enable iframe embedding & proxy ───────────────────────────────────
  enableIframes: true            # allow tiles of type “iframe”
  widgetsAlwaysUseProxy: true    # route iframe requests through Dashy’s own proxy to avoid CORS issues

sections:

  - name: '🎯 Core API'
    icon: 'fas fa-server'
    items:
      - title: 'FastAPI (primary)'
        url: 'https://api.${DOMAIN}/docs'
        description: 'RAG query & action API'
        icon: 'hl-fastapi'
        statusCheck: true
        statusUrl:  'https://api.${DOMAIN}/health'
        tags: ['api','docs']

      - title: 'FastAPI (secondary)'
        url: 'https://api2.${DOMAIN}/health'
        description: 'Load-balanced replica'
        icon: 'hl-fastapi'
        statusCheck: true
        statusUrl:  'https://api2.${DOMAIN}/health'
        tags: ['api','ha']

      - title: 'OpenAPI Swagger'
        url: 'https://api.${DOMAIN}/docs'
        icon: 'fas fa-book-open'
        statusCheck: false

      - title: 'ReDoc'
        url: 'https://api.${DOMAIN}/redoc'
        icon: 'fas fa-file-code'
        statusCheck: false

  - name: '🔐 Auth & Security'
    icon: 'fas fa-shield-alt'
    items:
      - title: 'Authentik SSO'
        url: 'https://auth.${DOMAIN}'
        icon: 'hl-authentik'
        statusCheck: true
        statusUrl:  'https://auth.${DOMAIN}/application/api'
        tags: ['auth','sso']

      - title: 'HashiCorp Vault'
        url: 'https://vault.${DOMAIN}'
        icon: 'hl-vault'
        statusCheck: true
        statusUrl:  'https://vault.${DOMAIN}/v1/sys/health'
        tags: ['secrets']

  - name: '🗄️ Storage & DB'
    icon: 'fas fa-database'
    items:
      - title: 'Qdrant Vector DB'
        url: 'https://qdrant.${DOMAIN}'
        icon: 'fas fa-vector-square'
        statusCheck: true
        statusUrl:  'https://qdrant.${DOMAIN}/health'

      - title: 'MongoDB Episodic'
        url: 'https://mongo-epi.${DOMAIN}'
        icon: 'hl-mongodb'
        statusCheck: true
        statusUrl:  'https://mongo-epi.${DOMAIN}/health'

      - title: 'MongoDB Procedural'
        url: 'https://mongo-proc.${DOMAIN}'
        icon: 'hl-mongodb'
        statusCheck: true
        statusUrl:  'https://mongo-proc.${DOMAIN}/health'

      - title: 'Redis Insight'
        url: 'https://redis-insight.${DOMAIN}'
        icon: 'hl-redis'
        statusCheck: true
        statusUrl:  'https://redis-insight.${DOMAIN}/'

      - title: 'Backrest Backup'
        url: 'https://backup.${DOMAIN}'
        icon: 'fas fa-archive'
        statusCheck: true
        statusUrl:  'https://backup.${DOMAIN}/api/v1/config'

  - name: '🤖 AI & Models'
    icon: 'fas fa-brain'
    items:
      - title: 'LiteLLM Proxy'
        url: 'https://litellm.${DOMAIN}'
        icon: 'fas fa-route'
        statusCheck: true
        statusUrl:  'https://litellm.${DOMAIN}/health'

      - title: 'Ollama Local Models'
        url: 'https://ollama.${DOMAIN}'
        icon: 'fas fa-microchip'
        statusCheck: true
        statusUrl:  'https://ollama.${DOMAIN}/api/tags'

      - title: 'OpenWebUI Chat'
        url: 'https://chat.${DOMAIN}'
        icon: 'fas fa-comments'
        statusCheck: true
        statusUrl:  'https://chat.${DOMAIN}/health'

  - name: '🔄 Workflows & Queue'
    icon: 'fas fa-project-diagram'
    items:
      - title: 'n8n Workflow Engine'
        url: 'https://n8n.${DOMAIN}'
        icon: 'hl-n8n'
        statusCheck: true
        statusUrl:  'https://n8n.${DOMAIN}/healthz'

      - title: 'RabbitMQ Management'
        url: 'https://rmq.${DOMAIN}'
        icon: 'hl-rabbitmq'
        statusCheck: true
        statusUrl:  'https://rmq.${DOMAIN}/api/overview'

  - name: '🌐 Infra & Networking'
    icon: 'fas fa-network-wired'
    items:
      - title: 'Traefik Dashboard'
        url: 'https://traefik.${DOMAIN}'
        icon: 'hl-traefik'
        statusCheck: true
        statusUrl:  'https://traefik.${DOMAIN}/api/rawdata'

  - name: '📊 System Monitoring'
    icon: 'fas fa-chart-pie'
    items:
      - title: 'API Latency (Grafana)'
        type: 'iframe'
        url: 'https://grafana.${DOMAIN}/d-solo/rag/api-latency?panelId=1&orgId=1'
        description: '95th percentile /query latency'

      - title: 'Queue Depth'
        type: 'iframe'
        url: 'https://grafana.${DOMAIN}/d-solo/rag/rabbitmq?panelId=4&orgId=1'
        description: 'Pending RabbitMQ tasks'

      - title: 'Container Stats'
        type: 'iframe'
        url: 'https://grafana.${DOMAIN}/d-solo/rag/docker-stats?panelId=2&orgId=1'
        description: 'CPU & RAM usage per container'

  - name: '⚙️ Dev & Ops'
    icon: 'fas fa-tools'
    items:
      - title: 'Portainer'
        url: 'https://portainer.${DOMAIN}'
        icon: 'fas fa-docker'
        statusCheck: true
        statusUrl:  'https://portainer.${DOMAIN}/api/status'

      - title: 'Healthchecks'
        url: 'https://health.${DOMAIN}'
        icon: 'fas fa-heartbeat'
        statusCheck: true
        statusUrl:  'https://health.${DOMAIN}/api/health'