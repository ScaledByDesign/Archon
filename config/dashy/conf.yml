# dashy/conf.yml

pageInfo:
  title: 'Zoi Production Dashboard'
  description: 'Central console for Zoi stack—APIs, infra, AI, automation'
  logo: '/assets/zoi-logo.svg'
  footerText: '🚀 Zoi v2.0 • Maintained by DevOps'

appConfig:
  theme: 'nord-frost'
  layout: 'auto'
  iconSize: 'medium'
  language: 'en'
  startingView: 'default'
  defaultOpeningMethod: 'newtab'
  statusCheck: true
  statusCheckInterval: 30
  enableSearch: true
  allowConfigEdit: false
  staticCaching: true

  # ─── Enable iframe embedding & proxy ───────────────────────────────────
  enableIframes: true            # allow tiles of type "iframe"
  widgetsAlwaysUseProxy: true    # route iframe requests through Dashy's own proxy to avoid CORS issues

sections:

  - name: '🎯 Core API & Services'
    icon: 'fas fa-server'
    items:
      - title: 'FastAPI Main'
        url: 'https://api.zoi.cc'
        description: 'RAG query & action API'
        icon: 'hl-fastapi'
        statusCheck: true
        statusUrl: 'https://api.zoi.cc/health'
        tags: ['api','docs']

      - title: 'FastAPI Docs'
        url: 'https://api.zoi.cc/docs'
        description: 'OpenAPI/Swagger documentation'
        icon: 'fas fa-book-open'
        statusCheck: false
        tags: ['docs','api']

      - title: 'LiteLLM Proxy'
        url: 'https://llm.zoi.cc'
        description: 'Multi-model LLM gateway'
        icon: 'fas fa-route'
        statusCheck: true
        statusUrl: 'https://llm.zoi.cc/health'
        tags: ['ai','proxy']

  - name: '🔐 Authentication & Security'
    icon: 'fas fa-shield-alt'
    items:
      - title: 'Authentik SSO'
        url: 'https://auth.zoi.cc'
        description: 'Identity & access management'
        icon: 'hl-authentik'
        statusCheck: true
        statusUrl: 'https://auth.zoi.cc/api/v3/root/config/'
        tags: ['auth','sso']

      - title: 'Authentik HTTPS'
        url: 'https://auth.zoi.cc'
        description: 'Secure authentication portal'
        icon: 'hl-authentik'
        statusCheck: false
        tags: ['auth','https']

  - name: '🤖 AI & Automation Platforms'
    icon: 'fas fa-brain'
    items:
      - title: 'SuperAGI'
        url: 'https://agi.zoi.cc'
        description: 'Autonomous AI agent platform'
        icon: 'fas fa-robot'
        statusCheck: false
        tags: ['ai','autonomous']

      - title: 'Open WebUI'
        url: 'https://webui.zoi.cc'
        description: 'Web interface for AI models'
        icon: 'fas fa-comments'
        statusCheck: false
        tags: ['ai','chat']

  - name: '🗄️ Storage & Databases'
    icon: 'fas fa-database'
    items:
      - title: 'Qdrant Vector DB'
        url: 'https://qdrant.zoi.cc'
        description: 'Vector similarity search engine'
        icon: 'fas fa-vector-square'
        statusCheck: true
        statusUrl: 'https://qdrant.zoi.cc/'
        tags: ['vector','search']

      - title: 'Redis Insight'
        url: 'https://redis.zoi.cc'
        description: 'Redis database management'
        icon: 'hl-redis'
        statusCheck: false
        tags: ['redis','cache']

      - title: 'Backrest Backup'
        url: 'https://backup.zoi.cc'
        description: 'Backup management system'
        icon: 'fas fa-archive'
        statusCheck: false
        tags: ['backup','storage']

  - name: '🔄 Workflows & Message Queue'
    icon: 'fas fa-project-diagram'
    items:
      - title: 'n8n Workflows'
        url: 'https://n8n.zoi.cc'
        description: 'Workflow automation engine'
        icon: 'hl-n8n'
        statusCheck: false
        tags: ['automation','workflows']

      - title: 'RabbitMQ Management'
        url: 'https://rabbitmq.zoi.cc'
        description: 'Message queue administration'
        icon: 'hl-rabbitmq'
        statusCheck: true
        statusUrl: 'https://rabbitmq.zoi.cc/api/overview'
        tags: ['queue','messaging']

  - name: '🌐 Infrastructure & Networking'
    icon: 'fas fa-network-wired'
    items:
      - title: 'Traefik Dashboard'
        url: 'https://traefik.zoi.cc'
        description: 'Reverse proxy & load balancer'
        icon: 'hl-traefik'
        statusCheck: true
        statusUrl: 'https://traefik.zoi.cc/api/rawdata'
        tags: ['proxy','routing']

      - title: 'Dashy Dashboard'
        url: 'https://dashy.zoi.cc'
        description: 'This dashboard'
        icon: 'fas fa-tachometer-alt'
        statusCheck: false
        tags: ['dashboard','monitoring']

  - name: '📊 System Monitoring'
    icon: 'fas fa-chart-pie'
    items:
      - title: 'Healthchecks'
        url: 'https://healthchecks.zoi.cc'
        description: 'Service health monitoring'
        icon: 'fas fa-heartbeat'
        statusCheck: false
        tags: ['health','monitoring']

      - title: 'Container Status'
        type: 'iframe'
        url: 'https://traefik.zoi.cc/dashboard'
        description: 'Live container status via Traefik'
        height: 400

  - name: '⚙️ System Status'
    icon: 'fas fa-tools'
    displayData:
      sortBy: 'status'
      rows: 1
      cols: 4
    items:
      - title: 'PostgreSQL'
        description: 'Primary database'
        icon: 'hl-postgresql'
        statusCheck: true
        statusUrl: 'https://api.zoi.cc/health'
        tags: ['database','core']

      - title: 'Redis'
        description: 'Cache & session store'
        icon: 'hl-redis'
        statusCheck: true
        statusUrl: 'https://api.zoi.cc/health'
        tags: ['cache','core']

      - title: 'MongoDB'
        description: 'Document database'
        icon: 'hl-mongodb'
        statusCheck: true
        statusUrl: 'https://api.zoi.cc/health'
        tags: ['database','documents']

      - title: 'Worker Processes'
        description: 'Background task workers'
        icon: 'fas fa-cogs'
        statusCheck: true
        statusUrl: 'https://api.zoi.cc/health'
        tags: ['workers','processing']