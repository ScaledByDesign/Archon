# Grafana Dashboard Provisioning Configuration
# Automatically loads dashboards from the dashboards directory

apiVersion: 1

providers:
  - name: 'Zoi System Dashboards'
    orgId: 1
    folder: 'Zoi'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

  - name: 'LiteLLM Dashboards'
    orgId: 1
    folder: 'LiteLLM'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/litellm

  - name: 'System Monitoring'
    orgId: 1
    folder: 'System'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/system
