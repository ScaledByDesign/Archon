# Grafana Dashboard Provisioning Configuration
# Automatically loads dashboards from the dashboards directory
# Enhanced configuration to properly organize all available dashboards

apiVersion: 1

providers:
  # Main Zoi Dashboards - Root level dashboards only
  - name: 'Zoi Main Dashboards'
    orgId: 1
    folder: 'Zoi'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      # Only load JSON files, ignore subdirectories
      foldersFromFilesStructure: false

  # LiteLLM AI Services Dashboards
  - name: 'LiteLLM AI Services'
    orgId: 1
    folder: 'LiteLLM'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/litellm
      foldersFromFilesStructure: false

  # System Monitoring Dashboards
  - name: 'System Monitoring'
    orgId: 1
    folder: 'System'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/system
      foldersFromFilesStructure: false
