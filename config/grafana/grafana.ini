# Grafana Configuration for Zoi AI Platform
# Enhanced configuration with alerting enabled

[default]
# Default admin user (change in production)
admin_user = admin
admin_password = admin

[server]
# Server settings
http_port = 3000
domain = localhost
root_url = http://localhost:7101
serve_from_sub_path = false

[database]
# Use SQLite for simplicity (can be changed to PostgreSQL in production)
type = sqlite3
path = /var/lib/grafana/grafana.db

[security]
# Security settings
admin_user = admin
admin_password = admin
secret_key = zoi_ai_platform_secret_key_2024
disable_gravatar = true
cookie_secure = false
cookie_samesite = lax

[users]
# User management
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Viewer

[auth.anonymous]
# Anonymous access
enabled = false

[alerting]
# Enable unified alerting (Grafana 8+)
enabled = true
execute_alerts = true
max_attempts = 3
min_interval_seconds = 10

[unified_alerting]
# Unified alerting settings
enabled = true
disabled_orgs = 
min_interval_seconds = 10
base_interval_seconds = 10
max_attempts = 3
evaluation_timeout_seconds = 30
notification_timeout_seconds = 30
max_annotation_age = 168h
max_state_history_annotations = 1000000
max_state_history_age = 168h

[unified_alerting.state_history]
enabled = true
backend = annotations

[unified_alerting.screenshots]
capture = false

[smtp]
# Email settings (configure for production)
enabled = false
host = localhost:587
user = 
password = 
cert_file = 
key_file = 
skip_verify = false
from_address = admin@grafana.localhost
from_name = Grafana
ehlo_identity = dashboard.example.com

[log]
# Logging settings
mode = console
level = info
filters = 

[paths]
# File paths
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[provisioning]
# Provisioning settings
dashboards = /etc/grafana/provisioning/dashboards
datasources = /etc/grafana/provisioning/datasources
alerting = /etc/grafana/provisioning/alerting

[feature_toggles]
# Enable new features
enable = ngalert

[rendering]
# Rendering settings
server_url = 
callback_url = 

[panels]
# Panel settings
enable_alpha = false
disable_sanitize_html = false

[plugins]
# Plugin settings
enable_alpha = false
app_tls_skip_verify_insecure = false

[enterprise]
# Enterprise features (not applicable for OSS)
license_path = 

[date_formats]
# Date format settings
full_date = MMM Do, YYYY hh:mm:ss a
interval_second = hh:mm:ss a
interval_minute = hh:mm a
interval_hour = MMM DD hh:mm a
interval_day = MMM DD
interval_month = MMM YYYY
interval_year = YYYY
use_browser_locale = false
default_timezone = browser
