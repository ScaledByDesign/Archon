# Traefik Static Configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  debug: true
  insecure: true

# Entry Points
entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  
  websecure:
    address: :443
    http:
      tls: {}
    # Enable PROXY protocol for proper client IP forwarding
    proxyProtocol:
      insecure: true
    forwardedHeaders:
      insecure: true

  metrics:
    address: :8080

  traefik:
    address: :8081

# Providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: zoi_frontend_network
    watch: true
  
  file:
    directory: /configuration/dynamic
    watch: true

# Certificate Resolvers
# Certificate resolvers for automatic SSL
# Disabled for development - enable when DNS is configured
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       tlsChallenge: {}
#       email: admin@zoi.cc
#       storage: /letsencrypt/acme.json
#       keyType: EC256
#       # Use staging for development to avoid rate limits
#       caServer: https://acme-staging-v02.api.letsencrypt.org/directory

# Logs
log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "200-299"
      - "400-499"
      - "500-599"
    retryAttempts: true
    minDuration: "10ms"

# Metrics
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

# Tracing (optional)
# tracing:
#   jaeger:
#     samplingServerURL: http://localhost:5778/sampling
#     localAgentHostPort: 127.0.0.1:6831

# Ping
ping:
  entryPoint: web

# Pilot (Traefik's anonymous usage statistics)
pilot:
  enabled: false
