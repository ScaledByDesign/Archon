# Traefik Static Configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  debug: true
  insecure: true  # Enable insecure API for local development

# Entry Points
entryPoints:
  web:
    address: :80
    # Disable HTTPS redirect for local development - HTTP only
  
  # Metrics entrypoint for Prometheus
  metrics:
    address: :8082

# Providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: zoi_backend_network
    watch: true
  
  file:
    directory: /configuration/dynamic
    watch: true

# Certificate Resolvers - REMOVED for HTTP-only local development

# Logs
log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "200-299"
      - "400-499"
      - "500-599"
    retryAttempts: true
    minDuration: "10ms"

# Metrics
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

# Tracing (optional)
# tracing:
#   jaeger:
#     samplingServerURL: http://localhost:5778/sampling
#     localAgentHostPort: 127.0.0.1:6831

# Ping
ping:
  entryPoint: web

# Pilot (Traefik's anonymous usage statistics)
pilot:
  enabled: false
