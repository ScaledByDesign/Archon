# LiteLLM Authentik Middleware Configuration
# Hybrid approach: Frontend SSO + Direct API access

http:
  middlewares:
    # Simple Authentik Forward Auth (following official documentation)
    authentik-forward-auth:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-authentik-username"
          - "X-authentik-groups"
          - "X-authentik-entitlements"  
          - "X-authentik-email"
          - "X-authentik-name"
          - "X-authentik-uid"
          - "X-authentik-jwt"
          - "X-authentik-meta-jwks"
          - "X-authentik-meta-outpost"
          - "X-authentik-meta-provider"
          - "X-authentik-meta-app"
          - "X-authentik-meta-version"
        authRequestHeaders:
          - "Accept"
          - "User-Agent"  
          - "X-Forwarded-Host"
          - "X-Forwarded-Proto"
          - "X-Forwarded-Uri"
          - "X-Real-IP"
          - "X-Forwarded-For"
          - "Cookie"

    # Auto-inject LiteLLM master key for authenticated frontend users
    litellm-frontend-auth-inject:
      headers:
        customRequestHeaders:
          Authorization: "Bearer sk-6df5295f77391ff7611a0fab11b989287012f48e46f58ae0"
          X-User-Context: "authenticated-via-authentik"

    # Combined middleware chain for LiteLLM Frontend (UI with SSO + key injection)
    litellm-frontend-auth:
      chain:
        middlewares:
          - authentik-forward-auth
          - litellm-frontend-auth-inject

    # n8n Frontend Authentication (UI only, no key injection needed)
    n8n-frontend-auth:
      chain:
        middlewares:
          - authentik-forward-auth

    # OpenWebUI Frontend Authentication (UI only, no key injection needed)
    openwebui-frontend-auth:
      chain:
        middlewares:
          - authentik-forward-auth
