# Dynamic Services Configuration
http:
  services:
    # FastAPI Backend Service
    fastapi-backend:
      loadBalancer:
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s
          scheme: http
        servers:
          - url: "http://fastapi-1:8000"

