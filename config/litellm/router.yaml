# LiteLLM Router Configuration - Simplified for Two LLM Studio Instances
# This file defines routing strategies for zoi-coder (14B) and zoi-planner (30B)

# Model Routing Rules
routing_rules:
  # Route based on request type
  by_request_type:
    # Code generation and analysis
    code:
      primary_models: ["zoi-coder", "gpt-3.5-turbo", "gpt-4o-mini"]
      fallback_models: ["zoi-planner", "gpt-4"]
      temperature: 0.1
      max_tokens: 8192
      
    # Creative writing and content generation
    creative:
      primary_models: ["zoi-planner", "gpt-4", "claude-3-opus-20240229"]
      fallback_models: ["zoi-coder", "gpt-3.5-turbo"]
      temperature: 0.8
      max_tokens: 8192
      
    # Data analysis and reasoning
    analysis:
      primary_models: ["zoi-planner", "gpt-4", "gpt-4-turbo"]
      fallback_models: ["zoi-coder", "gpt-3.5-turbo"]
      temperature: 0.3
      max_tokens: 8192
      
    # Quick responses and chat
    chat:
      primary_models: ["zoi-coder", "gpt-3.5-turbo", "claude-3-haiku-20240307"]
      fallback_models: ["zoi-planner", "gpt-4"]
      temperature: 0.7
      max_tokens: 4096
      
    # Vision and image analysis (using planner for complex reasoning)
    vision:
      primary_models: ["zoi-planner", "gpt-4", "claude-3-opus-20240229"]
      fallback_models: ["zoi-coder", "gpt-3.5-turbo"]
      temperature: 0.5
      max_tokens: 8192
      
    # Embedding generation
    embedding:
      primary_models: ["zoi-embed"]
      fallback_models: ["text-embedding-3-small", "text-embedding-3-large"]
      
  # Route based on user preferences (simplified tiers)
  by_user_tier:
    premium:
      allowed_models: ["zoi-planner", "zoi-coder", "zoi-embed", "gpt-4", "claude-3-opus-20240229"]
      rate_limit: 1000  # requests per hour
      priority: "high"
      
    standard:
      allowed_models: ["zoi-coder", "zoi-planner", "zoi-embed", "gpt-3.5-turbo", "claude-3-sonnet-20240229"]
      rate_limit: 500
      priority: "medium"
      
    basic:
      allowed_models: ["zoi-coder", "gpt-3.5-turbo", "claude-3-haiku-20240307"]
      rate_limit: 100
      priority: "low"
      
    local_only:
      allowed_models: ["zoi-coder", "zoi-planner", "zoi-embed"]
      rate_limit: 1000
      priority: "medium"
      cost_tracking: true

# Load Balancing Strategies
load_balancing:
  # Strategy for distributing requests
  strategy: "weighted_round_robin"  # Options: round_robin, weighted_round_robin, least_busy, random
  
  # Model weights for weighted strategies (simplified)
  model_weights:
    "zoi-planner": 10     # Powerful 30B model on RTX 5090
    "zoi-coder": 8        # Fast 14B model on RTX 5070 Ti
    "zoi-embed": 5        # Embedding model on RTX 5090
    "gpt-4": 10           # Maps to zoi-planner
    "gpt-4-turbo": 9      # Maps to zoi-planner
    "gpt-3.5-turbo": 7    # Maps to zoi-coder
    "gpt-4o-mini": 7      # Maps to zoi-coder
    "claude-3-opus-20240229": 10   # Maps to zoi-planner
    "claude-3-sonnet-20240229": 8  # Maps to zoi-coder
    "claude-3-haiku-20240307": 7   # Maps to zoi-coder
    
  # Health check configuration
  health_checks:
    interval: 60  # seconds
    timeout: 30   # seconds
    failure_threshold: 3
    recovery_threshold: 2
    
  # Circuit breaker configuration
  circuit_breaker:
    enabled: true
    error_threshold: 5     # Number of errors before opening circuit
    success_threshold: 2    # Number of successes to close circuit
    timeout: 60            # Seconds before attempting to close circuit
    half_open_requests: 3  # Number of test requests in half-open state

# Fallback Configuration
fallback_strategy:
  enabled: true
  max_retries: 2
  retry_delay: 1000  # milliseconds
  
  # Fallback chains (simplified)
  chains:
    - primary: "zoi-coder"
      fallbacks: ["zoi-planner"]
      
    - primary: "zoi-planner"
      fallbacks: ["zoi-coder"]
      
    - primary: "gpt-4"
      fallbacks: ["zoi-planner", "zoi-coder"]
      
    - primary: "gpt-3.5-turbo"
      fallbacks: ["zoi-coder", "zoi-planner"]
      
    - primary: "claude-3-opus-20240229"
      fallbacks: ["zoi-planner", "zoi-coder"]
      
    - primary: "claude-3-sonnet-20240229"
      fallbacks: ["zoi-coder", "zoi-planner"]

# Rate Limiting
rate_limiting:
  enabled: true
  
  # Global limits
  global:
    requests_per_minute: 1000
    tokens_per_minute: 100000
    
  # Per-model limits (simplified)
  per_model:
    "zoi-coder":
      requests_per_minute: 500
      tokens_per_minute: 50000
      
    "zoi-planner":
      requests_per_minute: 200
      tokens_per_minute: 80000
      
    "zoi-embed":
      requests_per_minute: 1000
      tokens_per_minute: 20000

# Cost Optimization
cost_optimization:
  enabled: true
  budget_tracking: true
  
  # Route to cheaper models when possible
  auto_downgrade:
    enabled: true
    budget_threshold: 0.8  # Downgrade when 80% of budget used
    
  # Model cost tiers (simplified)
  cost_tiers:
    expensive: ["zoi-planner", "gpt-4", "claude-3-opus-20240229"]
    moderate: ["zoi-coder", "gpt-3.5-turbo", "claude-3-sonnet-20240229"]
    cheap: ["zoi-embed"]

# Request Classification
request_classification:
  # Automatically detect request type based on content
  auto_detect: true
  
  # Keywords for classification
  keywords:
    code: ["function", "class", "debug", "implement", "code", "program", "script"]
    creative: ["story", "write", "create", "imagine", "describe", "narrative"]
    analysis: ["analyze", "explain", "reason", "compare", "evaluate", "assess"]
    chat: ["hello", "hi", "how are", "what is", "tell me", "can you"]
    vision: ["image", "picture", "visual", "see", "look", "show"]

# Monitoring and Metrics
monitoring:
  enabled: true
  metrics_endpoint: "/metrics"
  
  # Track these metrics
  track:
    - request_count
    - response_time
    - error_rate
    - token_usage
    - cost_per_request
    - model_performance
    
  # Alerting thresholds
  alerts:
    error_rate_threshold: 0.05      # Alert if error rate > 5%
    latency_threshold: 5000         # Alert if latency > 5 seconds
    cost_per_hour_threshold: 10.0   # Alert if cost > $10/hour

# Advanced Features
advanced:
  # Smart routing based on request complexity
  complexity_routing:
    enabled: true
    simple_threshold: 100      # Tokens - route to zoi-coder
    complex_threshold: 1000    # Tokens - route to zoi-planner
    
  # Context window management
  context_management:
    enabled: true
    max_context_tokens: 32768
    truncation_strategy: "sliding_window"
    
  # Response caching
  caching:
    enabled: true
    ttl: 600  # seconds
    max_cache_size: 1000  # entries