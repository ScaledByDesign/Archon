# ------------------------------
# MCP Servers Configuration
# ------------------------------
mcp_servers:
  archon:
    url: "http://Archon-MCP:7082/mcp"
    transport: "http"
    description: "Archon knowledge base, document search, task management, and project management"
    auth_type: "none"
    spec_version: "2025-03-26"
    enabled: true
    health_check: true
    timeout: 30
    retry_attempts: 3
    access_groups: ["dev_group", "knowledge_group", "voice_group", "admin_group"]
    tags: ["archon","knowledge","tasks","projects","documents","search","management"]
    mcp_info:
      mcp_server_cost_info:
        default_cost_per_query: 0.001
        tool_name_to_cost_per_query:
          search_documents: 0.002
          get_document: 0.001
          upload_document: 0.003
          create_task: 0.001
          update_task: 0.001
          delete_task: 0.001
          list_tasks: 0.001
          get_task: 0.001
          create_project: 0.002
          update_project: 0.002
          list_projects: 0.001
          get_project: 0.001
          get_weather: 0.005
          search_web: 0.010
          crawl_website: 0.015

# ------------------------------
# MCP Access Control / Permissions
# ------------------------------
mcp_access_control:
  default_access_groups: ["dev_group"]
  access_groups:
    dev_group:
      description: "Development team access to all tools"
      allowed_servers: ["archon"]
      allowed_tools: ["*"]
      rate_limit: 1000
    knowledge_group:
      description: "Knowledge management tools only"
      allowed_servers: ["archon"]
      allowed_tools: ["search_documents", "get_document", "upload_document"]
      rate_limit: 500
    voice_group:
      description: "Voice chat optimized tool access"
      allowed_servers: ["archon"]
      allowed_tools:
        ["list_projects","get_project","create_project","list_tasks","get_task","create_task","search_documents","get_weather","search_web"]
      rate_limit: 2000
    admin_group:
      description: "Full administrative access"
      allowed_servers: ["*"]
      allowed_tools: ["*"]
      rate_limit: 5000

# ------------------------------
# Router settings (intelligent routing)
# ------------------------------
router_settings:
  routing_strategy: "cost-based-routing"
  enable_pre_call_checks: true
  default_model: "zoi-coder-vllm"
  enable_fallbacks: true
  fallback_models: ["zoi-coder-vllm"]
  model_group_alias:
    "zoi:auto": "zoi-auto"
  num_retries: 2
  timeout: 300
  allow_model_override: true

  routes:
    - name: code_heavy_route
      models: [zoi-coder-vllm, zoi-helper]
      retry_policy: { max_retries: 2, backoff: exponential }

    - name: reason_route
      models: [zoi-thinker, zoi-coder-vllm]
      retry_policy: { max_retries: 2, backoff: exponential }

    - name: code_light_route
      models: [zoi-helper, zoi-thinker]
      retry_policy: { max_retries: 2, backoff: exponential }

    - name: embed_route
      models: [zoi-embed]

# ------------------------------
# Fallbacks (per alias)
# ------------------------------
fallbacks:
  zoi-auto: [zoi-helper, zoi-thinker]
  zoi-coder-30b: [zoi-helper]
  zoi-thinker: [zoi-helper, zoi-coder-30b]
  zoi-helper: [zoi-thinker]

# ------------------------------
# Cost hints (routing bias)
# ------------------------------
litellm_model_cost_map:
  zoi-coder-30b:
    input_cost_per_token: 0.0000009
    output_cost_per_token: 0.0000012
  zoi-thinker:
    input_cost_per_token: 0.0000004
    output_cost_per_token: 0.0000006
  zoi-helper:
    input_cost_per_token: 0.0000003
    output_cost_per_token: 0.0000004
  zoi-embed:
    input_cost_per_token: 0.0000002
    output_cost_per_token: 0.0000002