      max_tokens: 8192   # Large context for detailed responses
      top_p: 0.9        # Focused sampling
    model_info:
      mode: chat
      input_cost_per_token: 0.000003   # Track as if it were Claude pricing
      output_cost_per_token: 0.000015  # Track as if it were Claude pricing
