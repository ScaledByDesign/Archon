# ============================================
# Zoi — Simplified LiteLLM Configuration
# Two LLM Studio endpoints:
#   - ioz.zoi:1234/v1     (RTX 5070 Ti - Qwen 14B)
#   - astra.zoi:1234/v1   (RTX 5090 - Qwen 30B + Embeddings)
# ============================================

general_settings:
  # Logging & telemetry
  store_prompts_in_spend_logs: true
  telemetry: false
  json_logs: false

  # Timeouts
  timeout: 300
  request_timeout: 120
  stream_timeout: 60

  # Keys & defaults
  master_key: sk-wqn0xwq_vha4MVM2yzw
  default_model: zoi-coder
  fallback_models: [zoi-coder, zoi-planner]

  # Persistence
  store_model_in_db: true

  # Function calling
  enable_function_calling: true
  enable_parallel_function_calling: true

  # Budgets
  max_budget: 1000
  budget_duration: "1h"

  # Routing & fallbacks
  enable_loadbalancing: true
  enable_fallbacks: true

  # Diagnostics
  enable_detailed_logging: true
  log_raw_request_response: false

  # Health checks
  health_check: true
  health_check_interval: 120
  health_check_timeout: 60

  # Cost tracking
  track_cost_per_model: true
  track_cost_per_api_key: true
  track_cost_per_user: true
  budget_manager: true

  # Callbacks / metrics
  callbacks: ["prometheus"]
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  prometheus_metrics: true
  require_auth_for_metrics_endpoint: false

# ------------------------------
# LiteLLM Settings
# ------------------------------
litellm_settings:
  set_verbose: true
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 600
    namespace: litellm
    supported_call_types: ["acompletion", "atext_completion", "aembedding", "atranscription"]
  drop_params: true

  # Cost tracking
  enable_cost_tracking: true
  track_cost_per_model: true
  track_cost_per_api_key: true
  track_cost_per_user: true

  # MCP Aliases
  mcp_aliases:
    archon: archon
    knowledge: archon
    tasks: archon
    docs: archon
    projects: archon
    documents: archon

  # MCP Gateway
  mcp_gateway:
    enabled: true
    auto_discovery: true
    tool_name_format: "{alias}_{tool_name}"
    cache_tools: true
    cache_ttl: 300
    health_check_interval: 60
    max_concurrent_requests: 50
    request_timeout: 30

  # Inference-time prompt enrichment for MCP tool awareness
  system_prompt_enhancement:
    enabled: true
    include_available_tools: true
    tool_description_format: detailed
    auto_generate_examples: true

  # Default params for dev use
  default_params:
    temperature: 0.1
    max_tokens: 4096
    top_p: 0.9
    frequency_penalty: 0.05
    presence_penalty: 0.02

  # Dev persona
  system_message_prefix: >
    You are a senior software engineer and technical architect. Focus on providing accurate,
    well-structured, and production-ready solutions. Include code examples, best practices,
    and consider security, performance, and maintainability.

  # Vector Store (using astra.zoi for embeddings)
  vector_store:
    type: qdrant
    host: qdrant
    port: 6333
    collection_name: zoi_knowledge_base
    vector_size: 1024
    distance: cosine
    enable_rag: true
    similarity_threshold: 0.7
    max_results: 5
    embedding_model: zoi-embed

# ------------------------------
# Model registry (simplified)
# ------------------------------
model_list:
  # Primary: Qwen 14B on RTX 5070 Ti (ioz.zoi)
  - model_name: zoi-coder
    litellm_params:
      custom_llm_provider: openai
      model: qwen-14b
      api_base: http://ioz.zoi:1234/v1
      api_key: lm-studio
      temperature: 0.1
      max_tokens: 8192
      top_p: 0.9
      frequency_penalty: 0.05
      presence_penalty: 0.02
    model_info:
      mode: chat
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
      max_input_tokens: 32768
      max_output_tokens: 8192
      supports_function_calling: true
      supports_parallel_function_calling: true
