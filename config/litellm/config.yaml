# LiteLLM Proxy Configuration for Production RAG System
# This configuration supports multiple LLM providers with load balancing and fallbacks

model_list:
  # OpenAI Models
  - model_name: gpt-4
    litellm_params:
      model: gpt-4
      api_key: os.environ/OPENAI_API_KEY
      api_base: https://api.openai.com/v1
      max_tokens: 4096
      temperature: 0.7
    model_info:
      mode: chat
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.00003
      output_cost_per_token: 0.00006

  - model_name: gpt-4-turbo
