# Router Configuration for Load Balancing
router_settings:
  routing_strategy: "least-busy"  # Options: simple-shuffle, least-busy, usage-based-routing
  model_group_alias:
    # High-performance models for complex tasks
    "premium": ["gpt-4", "claude-3-opus", "azure-gpt-4"]
    # Balanced performance models
    "standard": ["gpt-4-turbo", "claude-3-sonnet", "gpt-3.5-turbo", "command-r-plus"]
    # Fast and efficient models
    "fast": ["claude-3-haiku", "gpt-3.5-turbo", "command-r", "gemini-pro"]
    # Vision-capable models
    "vision": ["gpt-4-vision", "gpt-4-turbo", "claude-3-opus", "claude-3-sonnet", "claude-3-haiku", "gemini-pro-vision"]
    # Local models for privacy-sensitive tasks
    "local": ["llama3.2-1b"]
    # Code-specific models
    "code": ["gpt-4", "claude-3-opus"]
    # Embedding models
    "embeddings": ["text-embedding-3-large", "text-embedding-3-small", "embed-english-v3"]
    # Cost-effective models
    "budget": ["gpt-3.5-turbo", "claude-3-haiku", "command-r", "gemini-pro"]

# Fallback Configuration
litellm_settings:
  # Fallback models in case primary models fail
  fallbacks: [
    {"gpt-4": ["gpt-4-turbo", "claude-3-opus", "azure-gpt-4"]},
    {"claude-3-opus": ["gpt-4", "claude-3-sonnet"]},
    {"gpt-4-turbo": ["gpt-4", "claude-3-sonnet"]},
    {"claude-3-sonnet": ["claude-3-haiku", "gpt-3.5-turbo"]},
    {"gpt-4-vision": ["gpt-4-turbo", "claude-3-opus"]},
    {"gemini-pro": ["gpt-3.5-turbo", "claude-3-haiku"]},
    {"command-r-plus": ["command-r", "claude-3-sonnet"]},
    {"text-embedding-3-large": ["text-embedding-3-small", "embed-english-v3"]},
    {"mistral-7b": ["llama2-7b", "llama3-8b"]},
    {"llama2-7b": ["mistral-7b", "llama3-8b"]},
    {"nomic-embed": ["text-embedding-3-small"]}
  ]
  
  # Request timeout settings
  request_timeout: 600
  
  # Retry configuration
  num_retries: 3
  
  # Rate limiting per model
  rpm: 500  # requests per minute
  tpm: 90000  # tokens per minute
  
  # Logging
  set_verbose: true
  
  # Health check settings
  health_check_interval: 300  # 5 minutes
  
  # Cost tracking
  track_cost_per_model: true
  track_cost_per_api_key: true

# General Settings
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: null  # Use in-memory for now, can be configured later
  
  # CORS settings for web integration
  allowed_origins: ["*"]
  
  # UI settings
  ui_access_mode: "admin_only"
  
  # Custom headers
  headers:
    "X-LiteLLM-Version": "1.0.0"
    "X-RAG-System": "Production"
    "X-Provider-Routing": "enabled"

# Environment-specific overrides
environment_variables:
  LITELLM_LOG: INFO
  LITELLM_DROP_PARAMS: true
  LITELLM_SET_VERBOSE: true
  LITELLM_SUCCESS_CALLBACK: ["prometheus"]
  LITELLM_FAILURE_CALLBACK: ["prometheus"]
