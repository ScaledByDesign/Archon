# ------------------------------
# MCP Servers Configuration
# ------------------------------
mcp_servers:
  # Archon Knowledge Base and Task Management
  archon_mcp_server:
    url: "http://archon-mcp:7082"
    transport: "http"
    description: "Archon knowledge base, document search, and task management"
    auth_type: "none"
    spec_version: "2025-03-26"
    access_groups: ["dev_group", "knowledge_group"]
    mcp_info:
      mcp_server_cost_info:
        # Default cost for Archon MCP operations
        default_cost_per_query: 0.001
        # Custom costs for specific tools
        tool_name_to_cost_per_query:
          search_documents: 0.002
          create_task: 0.001
          update_task: 0.001
          get_task_context: 0.001
          crawl_website: 0.005

# ------------------------------
# Router settings for intelligent routing
# ------------------------------
router_settings:
  # Use cost-based routing to automatically select the best model
  routing_strategy: "cost-based-routing"

  # Enable pre-call checks for better routing decisions
  enable_pre_call_checks: true

  # Model group aliases for compatibility
  model_group_alias:
    "zoi:auto": "zoi-auto"  # Map old autorouter calls to new model

  # Retry and timeout settings
  num_retries: 2
  timeout: 300

  # Route definitions for different use cases
  routes:
    # Complex coding, multi-file, long-context → prefer vLLM for performance
    - name: code_heavy_route
      models: [zoi-coder-vllm, zoi-helper]
      retry_policy: { max_retries: 2, backoff: exponential }

    # General reasoning / plans / critiques
    - name: reason_route
      models: [zoi-thinker, zoi-coder-vllm]
      retry_policy: { max_retries: 2, backoff: exponential }

    # Quick code edits and general assistance
    - name: code_light_route
      models: [zoi-helper, zoi-thinker]
      retry_policy: { max_retries: 2, backoff: exponential }

    # Embeddings API
    - name: embed_route
      models: [zoi-embed]

# ------------------------------
# Fallbacks (per alias)
# ------------------------------
fallbacks:
  # If auto router fails, fall back to helper
  zoi-auto: [zoi-helper, zoi-thinker]
  # If heavy coder is busy or fails, try helper
  zoi-coder-30b: [zoi-helper]
  # If thinker fails, bounce to helper or heavy coder
  zoi-thinker: [zoi-helper, zoi-coder-30b]
  # If helper fails, try thinker
  zoi-helper: [zoi-thinker]

# ------------------------------
# (Optional) Cost hints to bias routing toward cheaper models
# ------------------------------
litellm_model_cost_map:
  zoi-coder-30b:
    input_cost_per_token: 0.0000009
    output_cost_per_token: 0.0000012
  zoi-thinker:
    input_cost_per_token: 0.0000004
    output_cost_per_token: 0.0000006
  zoi-helper:
    input_cost_per_token: 0.0000003
    output_cost_per_token: 0.0000004
  zoi-embed:
    input_cost_per_token: 0.0000002
    output_cost_per_token: 0.0000002
