# ------------------------------
# Model Groups (for load balancing)
# ------------------------------
model_groups:
  - group_name: coding-group
    models:
      - model_name: zoi-coder
        priority: 1
      - model_name: zoi-planner
        priority: 2

  - group_name: reasoning-group
    models:
      - model_name: zoi-planner
        priority: 1
      - model_name: zoi-coder
        priority: 2

# ------------------------------
# Vector Store Registry
# ------------------------------
vector_store_registry:
  - vector_store_name: "Zoi Knowledge Base"
    litellm_params:
      vector_store_id: "zoi_main_knowledge"
      custom_llm_provider: "qdrant"
      vector_store_description: "Main knowledge repository for Zoi AI system"
      vector_store_metadata:
        host: "qdrant"
        port: 6333
        collection_name: "zoi_knowledge_base"
        vector_size: 1024
        distance: "cosine"
        embedding_model: "zoi-embed"

  - vector_store_name: "Archon MCP Knowledge"
    litellm_params:
      vector_store_id: "archon_knowledge"
      custom_llm_provider: "qdrant"
      vector_store_description: "Knowledge base for Archon MCP system"
      vector_store_metadata:
        host: "qdrant"
        port: 6333
        collection_name: "archon_knowledge"
        vector_size: 1024
        distance: "cosine"
        embedding_model: "zoi-embed"

# ------------------------------
# MCP Servers Configuration
# ------------------------------
mcp_servers:
  archon:
    url: "http://Archon-MCP:7082/mcp"
    transport: "http"
    description: "Archon knowledge base, document search, task management, and project management"
    auth_type: "none"
    spec_version: "2025-03-26"
    enabled: true
    health_check: true
    timeout: 30
    retry_attempts: 3
    access_groups: ["dev_group", "knowledge_group", "voice_group", "admin_group"]
    tags: ["archon","knowledge","tasks","projects","documents","search","management"]
    mcp_info:
      mcp_server_cost_info:
        default_cost_per_query: 0.001
        tool_name_to_cost_per_query:
          search_documents: 0.002
          get_document: 0.001
          upload_document: 0.003
          create_task: 0.001
          update_task: 0.001
          delete_task: 0.001
          list_tasks: 0.001
          get_task: 0.001
          create_project: 0.002
          update_project: 0.002
          list_projects: 0.001
          get_project: 0.001

# ------------------------------
# MCP Access Control
# ------------------------------
mcp_access_control:
  default_access_groups: ["dev_group"]
  access_groups:
    dev_group:
      description: "Development team access to all tools"
      allowed_servers: ["archon"]
      allowed_tools: ["*"]
      rate_limit: 1000
    knowledge_group:
      description: "Knowledge management tools only"
      allowed_servers: ["archon"]
      allowed_tools: ["search_documents", "get_document", "upload_document"]
      rate_limit: 500
    voice_group:
      description: "Voice chat optimized tool access"
      allowed_servers: ["archon"]
      allowed_tools:
        ["list_projects","get_project","create_project","list_tasks","get_task","create_task","search_documents"]
      rate_limit: 2000
    admin_group:
      description: "Full administrative access"
      allowed_servers: ["*"]
      allowed_tools: ["*"]
      rate_limit: 5000

# ------------------------------
# Router settings (simplified)
# ------------------------------
router_settings:
  routing_strategy: "simple"
  enable_pre_call_checks: true
  default_model: "zoi-coder"
  enable_fallbacks: true
  fallback_models: ["zoi-coder", "zoi-planner"]
  model_group_alias:
    "coding": "coding-group"
    "reasoning": "reasoning-group"
  num_retries: 2
  timeout: 300
  allow_model_override: true

  routes:
    - name: code_route
      models: [zoi-coder, zoi-planner]
      retry_policy: { max_retries: 2, backoff: exponential }

    - name: reasoning_route
      models: [zoi-planner, zoi-coder]
      retry_policy: { max_retries: 2, backoff: exponential }

    - name: embed_route
      models: [zoi-embed]

# ------------------------------
# Fallbacks
# ------------------------------
fallbacks:
  zoi-coder: [zoi-planner]
  zoi-planner: [zoi-coder]
  zoi-auto: [zoi-coder, zoi-planner]

# ------------------------------
# Cost hints
# ------------------------------
litellm_model_cost_map:
  zoi-coder:
    input_cost_per_token: 0.000001
    output_cost_per_token: 0.000002
  zoi-planner:
    input_cost_per_token: 0.000002
    output_cost_per_token: 0.000004
  zoi-embed:
    input_cost_per_token: 0.0000005
    output_cost_per_token: 0.0000005