# ============================================
# Zoi — LiteLLM front door (container port 4000, host 7010)
# Internal backends:
#   - vLLM (3090):   http://vllm:8000/v1
#   - Ollama (5070): http://ollama:11434
# ============================================

general_settings:
  # Logging & telemetry
  store_prompts_in_spend_logs: true
  telemetry: false
  json_logs: false

  # Timeouts
  timeout: 300
  request_timeout: 120
  stream_timeout: 60

  # Keys & defaults
  master_key: sk-wqn0xwq_vha4MVM2yzw
  default_model: zoi-coder-vllm
  fallback_models: [zoi-coder-vllm]

  # Persistence
  store_model_in_db: true

  # Function calling
  enable_function_calling: true
  enable_parallel_function_calling: true

  # Budgets
  max_budget: 1000
  budget_duration: "1h"

  # Routing & fallbacks
  enable_loadbalancing: true
  enable_fallbacks: true

  # Diagnostics
  enable_detailed_logging: true
  log_raw_request_response: false

  # Health checks
  health_check: true
  health_check_interval: 120
  health_check_timeout: 60

  # Cost tracking
  track_cost_per_model: true
  track_cost_per_api_key: true
  track_cost_per_user: true
  budget_manager: true

  # Callbacks / metrics
  callbacks: ["prometheus"]
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  prometheus_metrics: true
  require_auth_for_metrics_endpoint: false

# ------------------------------
# LiteLLM Settings
# ------------------------------
litellm_settings:
  set_verbose: true
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 600
    namespace: litellm
    supported_call_types: ["acompletion", "atext_completion", "aembedding", "atranscription"]
  drop_params: true  # Drop unsupported params (e.g., dimensions/encoding_format) for providers like Ollama

  # Cost tracking (dup kept for clarity, harmless with general_settings)
  enable_cost_tracking: true
  track_cost_per_model: true
  track_cost_per_api_key: true
  track_cost_per_user: true

  # MCP Aliases
  mcp_aliases:
    archon: archon
    knowledge: archon
    tasks: archon
    docs: archon
    projects: archon
    documents: archon

  # MCP Gateway
  mcp_gateway:
    enabled: true
    auto_discovery: true
    tool_name_format: "{alias}_{tool_name}"
    cache_tools: true
    cache_ttl: 300
    health_check_interval: 60
    max_concurrent_requests: 50
    request_timeout: 30

  # Inference-time prompt enrichment for MCP tool awareness
  system_prompt_enhancement:
    enabled: true
    include_available_tools: true
    tool_description_format: detailed
    auto_generate_examples: true

  # Default params for dev use
  default_params:
    temperature: 0.1
    max_tokens: 4096
    top_p: 0.9
    frequency_penalty: 0.05
    presence_penalty: 0.02

  # Dev persona
  system_message_prefix: >
    You are a senior software engineer and technical architect. Focus on providing accurate,
    well-structured, and production-ready solutions. Include code examples, best practices,
    and consider security, performance, and maintainability.

  # Vector Store (global default RAG provider)
  vector_store:
    type: qdrant
    host: qdrant
    port: 6333
    collection_name: zoi_knowledge_base
    vector_size: 1024
    distance: cosine
    enable_rag: true
    similarity_threshold: 0.7
    max_results: 5
    embedding_model: zoi-embed

# ------------------------------
# Vector Store Registry (for UI Management)
# ------------------------------
vector_store_registry:
  - vector_store_name: "Zoi Knowledge Base"
    litellm_params:
      vector_store_id: "zoi_main_knowledge"
      custom_llm_provider: "qdrant"
      vector_store_description: "Main knowledge repository for Zoi AI system"
      vector_store_metadata:
        host: "qdrant"
        port: 6333
        collection_name: "zoi_knowledge_base"
        vector_size: 1024
        distance: "cosine"
        embedding_model: "zoi-embed"

  - vector_store_name: "Archon MCP Knowledge"
    litellm_params:
      vector_store_id: "archon_knowledge"
      custom_llm_provider: "qdrant"
      vector_store_description: "Knowledge base for Archon MCP system"
      vector_store_metadata:
        host: "qdrant"
        port: 6333
        collection_name: "archon_knowledge"
        vector_size: 1024
        distance: "cosine"
        embedding_model: "zoi-embed"

  - vector_store_name: "Code Embeddings"
    litellm_params:
      vector_store_id: "code_embeddings"
      custom_llm_provider: "qdrant"
      vector_store_description: "Code snippets and documentation embeddings"
      vector_store_metadata:
        host: "qdrant"
        port: 6333
        collection_name: "code_embeddings"
        vector_size: 1024
        distance: "cosine"
        embedding_model: "zoi-embed"

  - vector_store_name: "N8N Workflows"
    litellm_params:
      vector_store_id: "n8n_workflows"
      custom_llm_provider: "qdrant"
      vector_store_description: "N8N workflow documentation and examples"
      vector_store_metadata:
        host: "qdrant"
        port: 6333
        collection_name: "n8n_workflows"
        vector_size: 1024
        distance: "cosine"
        embedding_model: "zoi-embed"

  - vector_store_name: "OpenWebUI Conversations"
    litellm_params:
      vector_store_id: "openwebui_conversations"
      custom_llm_provider: "qdrant"
      vector_store_description: "Chat history and conversation embeddings"
      vector_store_metadata:
        host: "qdrant"
        port: 6333
        collection_name: "openwebui_conversations"
        vector_size: 1024
        distance: "cosine"
        embedding_model: "zoi-embed"

  - vector_store_name: "Unified Knowledge (All Collections)"
    litellm_params:
      vector_store_id: "unified_all_collections"
      custom_llm_provider: "custom"
      vector_store_description: "Cross-collection search across all 10 knowledge sources"
      vector_store_metadata:
        api_base: "http://unified-rag:8000"
        search_endpoint: "/search"
        collections_count: 10
        sources: "Qdrant + PostgreSQL + Neo4j"

  - vector_store_name: "Shared Embeddings (PostgreSQL)"
    litellm_params:
      vector_store_id: "postgres_shared_embeddings"
      custom_llm_provider: "pgvector"
      vector_store_description: "Cross-service shared embeddings in PostgreSQL"
      vector_store_metadata:
