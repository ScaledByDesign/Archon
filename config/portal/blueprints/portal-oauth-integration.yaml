version: 1
metadata:
  name: 07-portal-oauth-integration
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: "Step 7: Portal OAuth2/OIDC and Forward Auth Integration"
context: {}

entries:
  # OAuth2/OIDC Provider for Portal API access (if needed)
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Portal OAuth2 Provider
    attrs:
      name: "Portal OAuth2 Provider"
      client_type: confidential
      client_id: portal-oauth-client
      authorization_grant_type: authorization-code
      redirect_uris: |
        http://portal.zoi.local/auth/callback
        https://portal.zoi.local/auth/callback
      signing_alg: RS256
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      access_code_validity: minutes=10
      access_token_validity: minutes=60
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

  # Forward Auth Provider for Portal UI access
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: Portal Forward Auth
    attrs:
      name: "Portal Forward Auth"
      mode: forward_domain
      external_host: http://portal.zoi.local
      internal_host: http://portal:3000
      internal_host_ssl_validation: false
      skip_path_regex: |
        ^/api/health.*
        ^/favicon\.ico$
        ^/_next/.*
        ^/static/.*

  # Application for Portal Frontend
  - model: authentik_core.application
    state: present
    identifiers:
      name: Portal App Organizer
    attrs:
      name: "Portal App Organizer"
      slug: "portal-frontend"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Portal Forward Auth"]]
      policy_engine_mode: any
      group: "zoi-users"

  # Policy Binding - Reuse existing group access
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, "portal-frontend"]]
      group: !Find [authentik_core.group, [name, "zoi-users"]]
    attrs:
      target: !Find [authentik_core.application, [slug, "portal-frontend"]]
      group: !Find [authentik_core.group, [name, "zoi-users"]]
      order: 0
      enabled: true

  # Outpost for Forward Auth
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: Portal Forward Auth Outpost
    attrs:
      name: "Portal Forward Auth Outpost"
      type: proxy
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, "Portal Forward Auth"]]
      config:
        authentik_host: http://auth.zoi.local
        authentik_host_insecure: true
        log_level: info
