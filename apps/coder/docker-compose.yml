name: zoi-coder

services:
  # 🤖 Refact Server - AI Inference Server with Web UI
  refact-server:
    image: smallcloud/refact_self_hosting:latest
    container_name: refact-server
    restart: unless-stopped
    ports:
      - "${REFACT_SERVER_PORT:-7400}:8008"
    environment:
      # Database Configuration - Use PostgreSQL instead of Cassandra
      - REFACT_DATABASE_HOST=postgres
      - REFACT_DATABASE_PORT=5432
      - REFACT_DATABASE_NAME=refact
      - REFACT_DATABASE_USER=postgres
      - REFACT_DATABASE_PASSWORD=litellm_password123
      
      # Storage Configuration
      - REFACT_PERM_DIR=/perm_storage
      - REFACT_TMP_DIR=/tmp
      
      # Model Configuration
      - MODELS_PATH=/models
      - HF_HOME=/models/huggingface
      - TRANSFORMERS_CACHE=/models/huggingface/transformers
      
      # LiteLLM Integration
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY}
      
      # Redis Cache
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      
      # Performance Settings
      - CUDA_VISIBLE_DEVICES=all
      - RDMAV_FORK_SAFE=0
      - RDMAV_HUGEPAGES_SAFE=0
      
      # Security
      - REFACT_ADMIN_TOKEN=${REFACT_ADMIN_TOKEN:-refact-admin-token-change-me}
      
    volumes:
      - refact_storage:/perm_storage
      - ${MODELS_PATH:-D:/models}:/models:ro
      - /etc/localtime:/etc/localtime:ro
    
    networks:
      - zoi-network
    
    # Dependencies managed by main docker-compose.yml
    # depends_on services from other stacks
    
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.refact-server.rule=Host(`refact.${DOMAIN:-zoi.local}`)"
      - "traefik.http.routers.refact-server.entrypoints=web"
      - "traefik.http.services.refact-server.loadbalancer.server.port=8008"
    
    # GPU support for NVIDIA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 🦀 Refact Agent - LSP Server for IDE Integration
  # TEMPORARILY DISABLED - refact-lsp binary not available in standard image
