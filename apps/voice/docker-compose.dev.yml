name: zoi-voice
services:
  app:
    # Override for development - use volume mounts and auto-restart
    volumes:
      # Mount code for live development
      - ./code:/app/code
      # Mount centralized model directory from host
      - ${MODELS_BASE_DIR:-D:/models}:/models
    environment:
      # Development-specific settings
      - LOG_LEVEL=DEBUG
      - PYTHONPATH=/app/code
      # Enable auto-reload for development
      - UVICORN_RELOAD=true
    # Override the command to enable auto-reload
    command: python -m uvicorn server:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/code
    # For development, we might want to see more logs
    stdin_open: true
    tty: true
