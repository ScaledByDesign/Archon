# Define named volumes for persistent data
volumes:
  # Keep mcp_logs as a named volume since it's not model data
  mcp_logs:
    driver: local
  # All model data now uses host directory D:\models
  # No need for separate named volumes

# Use external zoi-network for communication with LiteLLM and other services
networks:
  default:
    external: true
    name: zoi-network