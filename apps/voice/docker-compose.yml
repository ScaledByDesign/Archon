  #     # Mount workspace for filesystem server access
  #     - ./:/workspace
  #     # Mount MCP bridge server and requirements
  #     - ./docker/mcp-bridge-server.py:/app/mcp-bridge-server.py:ro
  #     - ./docker/requirements-mcp.txt:/app/requirements-mcp.txt:ro
  #     # Mount a directory for MCP server logs
