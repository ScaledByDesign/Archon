services:
  # Your FastAPI Application Service
  app:
    build: . # Build the image using the ENHANCED Dockerfile with caching
    image: realtime-voice-chat:latest # Name the image built by 'build:'
    # For enhanced caching during development, use:
    # docker-compose -f docker-compose.yml -f docker-compose.cache.yml up --build
    container_name: realtime-voice-chat-app
    # Port mapping removed - using Traefik reverse proxy
    expose:
      - "8000"
    environment:
      # Service URLs (with fallbacks) - Use LiteLLM proxy for Zoi-core integration
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-http://litellm:4000}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-sk-wqn0xwq_vha4MVM2yzw}
      - MCP_BRIDGE_URL=${MCP_BRIDGE_URL:-}
      # Application Configuration (with fallbacks)
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_AUDIO_QUEUE_SIZE=${MAX_AUDIO_QUEUE_SIZE:-50}
      - WHISPER_MODEL=${WHISPER_MODEL:-base.en}
      # GPU Configuration (with fallbacks)
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      # Centralized model storage paths (using container paths with fallbacks)
      - HF_HOME=/models/${HF_CACHE_SUBDIR:-huggingface}
      - TORCH_HOME=/models/${TORCH_CACHE_SUBDIR:-torch}
      - TRANSFORMERS_CACHE=/models/${HF_CACHE_SUBDIR:-huggingface}/transformers
      - WHISPER_CACHE_DIR=/models/${WHISPER_CACHE_SUBDIR:-whisper}
      - COQUI_TTS_CACHE_DIR=/models/${COQUI_TTS_CACHE_SUBDIR:-coqui-tts}
    volumes:
       # Optional: Mount code for live development (uncomment when needed)
       - ./code:/app/code
       # Mount centralized model directory from host (with fallback)
       - ${MODELS_BASE_DIR:-D:/models}:/models
       # Individual model cache directories (with fallbacks)
       - ${MODELS_BASE_DIR:-D:/models}/${HF_CACHE_SUBDIR:-huggingface}:/models/${HF_CACHE_SUBDIR:-huggingface}
       - ${MODELS_BASE_DIR:-D:/models}/${TORCH_CACHE_SUBDIR:-torch}:/models/${TORCH_CACHE_SUBDIR:-torch}
       - ${MODELS_BASE_DIR:-D:/models}/${WHISPER_CACHE_SUBDIR:-whisper}:/models/${WHISPER_CACHE_SUBDIR:-whisper}
       - ${MODELS_BASE_DIR:-D:/models}/${COQUI_TTS_CACHE_SUBDIR:-coqui-tts}:/models/${COQUI_TTS_CACHE_SUBDIR:-coqui-tts}
    # No internal dependencies - uses external core services
    deploy: # GPU access for the app
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    restart: unless-stopped
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.voice-chat.rule=Host(`voice.zoi.local`)"
      - "traefik.http.routers.voice-chat.entrypoints=web"
      - "traefik.http.services.voice-chat.loadbalancer.server.port=8000"
      # Optional: Enable HTTPS
      - "traefik.http.routers.voice-chat-secure.rule=Host(`voice.zoi.local`)"
      - "traefik.http.routers.voice-chat-secure.entrypoints=websecure"
      - "traefik.http.routers.voice-chat-secure.tls=true"

  # Note: Using external Ollama service from core stack (host.docker.internal:7040)

  # MCP Servers Service with HTTP Bridge
  # mcp-servers:
