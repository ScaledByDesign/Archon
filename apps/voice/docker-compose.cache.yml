# Docker Compose override for enhanced caching during development
# Usage: docker-compose -f docker-compose.yml -f docker-compose.cache.yml up --build

name: zoi-voice
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Enable BuildKit cache mounts and inline cache
      cache_from:
        - realtime-voice-chat:latest
      args:
        - BUILDKIT_INLINE_CACHE=1
      # Use BuildKit for advanced caching features
      x-bake:
        cache-from:
          - type=local,src=.buildcache
        cache-to:
          - type=local,dest=.buildcache,mode=max
    environment:
      # Enable BuildKit
      - DOCKER_BUILDKIT=1
      - BUILDKIT_PROGRESS=plain
    # Additional development volumes for faster iteration
    volumes:
      # Mount code for live development (already in main compose)
      - ./code:/app/code
      # Mount centralized model directory from host (already in main compose)
      - ${MODELS_BASE_DIR:-D:/models}:/models
      # Additional cache mounts for development
      - pip_cache:/root/.cache/pip
      - apt_cache:/var/cache/apt
      - apt_lists:/var/lib/apt/lists

# Named volumes for persistent caches
volumes:
  pip_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.cache/pip
  apt_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.cache/apt
  apt_lists:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.cache/apt-lists
