name: sff-llm-standalone

networks:
  ai:
    driver: bridge

volumes:
  flowsie-data:
  neo4j-data:
  postgres-data:
  redis-data:
  text-gen-data:

services:
  # 🧠 Ollama (RTX 5070 Ti GPU Enabled)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-7040}:11434"
    volumes:
      - "${OLLAMA_MODELS:-D:/models/ollama}:/root/.ollama"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_MODELS=/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks: [ai]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:11434/api/tags || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  # 🤖 vLLM (RTX 5070 Ti GPU Enabled)
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    ports:
      - "${VLLM_PORT:-7030}:8000"
    volumes:
      - "${HF_HOME:-D:/models/huggingface}:/root/.cache/huggingface"
      - "${VLLM_MODEL_PATH:-D:/models/vllm}:/models"
    environment:
      - VLLM_LOGGING_LEVEL=INFO
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface/transformers
      - VLLM_CACHE_DIR=/models/cache
    command: ["Qwen/Qwen2.5-Coder-7B-Instruct", "--host", "0.0.0.0", "--port", "8000", "--max-model-len", "8192", "--gpu-memory-utilization", "0.9"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks: [ai]
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsSL http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  # 🚪 LiteLLM Router
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    ports:
      - "${LITELLM_PORT:-7010}:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_CONFIG=/app/config.yaml
      - DATABASE_URL=postgresql://litellm:litellm_password123@postgres:5432/litellm
      - POSTGRES_PRISMA_URL=postgresql://litellm:litellm_password123@postgres:5432/litellm
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - STORE_MODEL_IN_DB=True
      - PORT=4000
    command: ["--config", "/app/config.yaml"]
    depends_on:
      - vllm
      - ollama
      - postgres
      - redis
    restart: unless-stopped
    networks: [ai]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:4000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  # 🔀 AutoRouter (Zoi meta router)
  autorouter:
    image: node:20-slim
    container_name: zoi-autorouter
    working_dir: /srv
    command: bash -lc "npm install && node server.js"
    volumes:
      - ./autorouter:/srv
    ports:
      - "${AUTOROUTER_PORT:-7020}:7020"
    environment:
      - PORT=7020
      - LITELLM_URL=http://litellm:4000/v1
    depends_on: [litellm]
    restart: unless-stopped
    networks: [ai]

  # 🧠 Vector Database (Qdrant for RAG)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "${QDRANT_PORT:-7050}:6333"
    restart: unless-stopped
    networks: [ai]

  # 🌊 Flowsie UI (Flowise fork)
  flowsie:
    image: flowiseai/flowise:latest
    container_name: flowsie
    ports:
      - "${FLOWSIE_PORT:-7070}:3000"
    volumes:
      - flowsie-data:/root/.flowise
    environment:
      - PORT=3000
      # Redis Configuration for Caching and Queue Management
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MODE=queue
      - QUEUE_NAME=flowise-queue
      - WORKER_CONCURRENCY=5
    restart: unless-stopped
    networks: [ai]
    depends_on:
      - redis

  # 🧠 Neo4j - Graph Database for structured reasoning
  neo4j:
    image: neo4j:5.20
    container_name: neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7061}:7474"   # Browser UI (HTTP)
      - "${NEO4J_BOLT_PORT:-7062}:7687"   # Bolt protocol (drivers, APIs)
    environment:
      NEO4J_AUTH: neo4j/password123    # ⚠️ You should change this in production
    volumes:
      - neo4j-data:/data
    restart: unless-stopped
    networks: [ai]

  # 🐘 PostgreSQL - Local Database for LiteLLM persistence
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    ports:
      - "${POSTGRES_PORT:-7063}:5432"
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm_password123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [ai]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🔴 Redis - Cache for LiteLLM performance optimization
  redis:
    image: redis:7-alpine
    container_name: litellm-redis
    ports:
      - "${REDIS_PORT:-7064}:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks: [ai]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 📚 Text Generation WebUI - GGUF Model Server
  text-generation-webui:
    image: atinoda/text-generation-webui:default
    container_name: text-gen-webui
    ports:
      - "${TEXT_GEN_PORT:-7080}:7860"
      - "${TEXT_GEN_API_PORT:-7081}:5000"
    volumes:
      - "${GGUF_MODELS:-D:/models/gguf}:/app/models"
      - text-gen-data:/app/characters
      - text-gen-data:/app/presets
    environment:
      - CLI_ARGS=--api --listen --listen-port 7860 --api-port 5000 --loader llama.cpp
    restart: unless-stopped
    networks: [ai]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


