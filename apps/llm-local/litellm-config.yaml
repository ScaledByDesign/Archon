# ============================================
# Zoi — LiteLLM front door (container port 4000, host 7010)
# Internal backends:
#   - vLLM (3090):   http://vllm:8000/v1
#   - Ollama (5070): http://ollama:11434/v1
# ============================================

general_settings:
  telemetry: false
  timeout: 300  # Increased timeout for local models
  prometheus_metrics: true
  set_verbose: true
  json_logs: true
  # Optional global rate limits (uncomment to enable)
  # rpm: 6000
  # tpm: 2000000

  # Database settings for persistence
  store_model_in_db: true

  # Health check settings
  health_check: true
  health_check_interval: 120  # Check every 2 minutes
  health_check_timeout: 60    # 60 second timeout for health checks

  # Callback settings for monitoring
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]

# ------------------------------
# LiteLLM Settings
# ------------------------------
litellm_settings:
  set_verbose: true
  cache: true
  cache_params:
    type: "redis"
    host: "redis"
    port: 6379
    ttl: 600
    namespace: "litellm"
    supported_call_types: ["acompletion", "atext_completion", "aembedding", "atranscription"]

  # Development-focused default parameters
  default_params:
    temperature: 0.1        # Default to precise, deterministic responses
    max_tokens: 4096        # Generous token limit for code explanations
    top_p: 0.9             # Focused sampling for technical accuracy
    frequency_penalty: 0.05 # Slight penalty to reduce repetitive code patterns
    presence_penalty: 0.02  # Encourage diverse technical approaches

  # Development-specific prompt enhancements
  system_message_prefix: "You are a senior software engineer and technical architect. Focus on providing accurate, well-structured, and production-ready solutions. Include relevant code examples, best practices, and consider security, performance, and maintainability."

  # Vector Store Configuration for RAG
  vector_store:
    type: "qdrant"
    host: "qdrant"
    port: 6333
    collection_name: "zoi_knowledge_base"
    vector_size: 1024  # mxbai-embed-large dimension
    distance: "cosine"
    enable_rag: true
    similarity_threshold: 0.7
    max_results: 5
    embedding_model: "zoi-embed"

# ------------------------------
# Model registry (aliases)
# ------------------------------
model_list:
  # === High-performance development-focused model on RTX 5070 Ti via vLLM ===
  # vLLM is currently running Qwen/Qwen3-0.6B (optimized for development tasks)
  - model_name: zoi-coder-vllm
    litellm_params:
      model: openai/Qwen/Qwen3-0.6B  # This matches what vLLM actually loaded
      api_base: http://vllm:8000/v1
      api_key: dummy
      # Development-optimized parameters
      temperature: 0.05  # Very low for precise, deterministic code
      max_tokens: 6144   # Increased for longer code explanations
      top_p: 0.9        # Slightly more focused for technical accuracy
      frequency_penalty: 0.1  # Reduce repetition in code examples
      presence_penalty: 0.05  # Encourage diverse technical solutions

  # === Development-focused reasoning on 5070 Ti via Ollama ===
  - model_name: zoi-thinker
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://ollama:11434
      api_key: dummy
      # Parameters optimized for technical analysis and architecture planning
      temperature: 0.2   # Low for logical, structured thinking
      max_tokens: 4096   # Sufficient for detailed technical explanations
      top_p: 0.9        # Focused responses for technical accuracy

  # === Fast development assistant on 5070 Ti via Ollama ===
  - model_name: zoi-helper
    litellm_params:
      model: ollama/qwen2.5-coder:7b-instruct
      api_base: http://ollama:11434
      api_key: dummy
      timeout: 180  # 3 minute timeout for local models
      # Parameters optimized for quick code fixes and suggestions
      temperature: 0.1   # Very precise for code accuracy
      max_tokens: 3072   # Good balance for code snippets and explanations
      top_p: 0.85       # Slightly more focused for coding tasks

  # === Embeddings (for RAG) on 5070 Ti via Ollama ===
  - model_name: zoi-embed
    litellm_params:
      model: ollama/mxbai-embed-large
      api_base: http://ollama:11434
      api_key: dummy
      timeout: 60  # 1 minute timeout for embeddings
    model_info:
      mode: embedding  # lets LiteLLM know this is an embedding model

  # === RAG-Enhanced Development Models (with Vector Store Integration) ===
  - model_name: zoi-rag-helper
    litellm_params:
      model: ollama/qwen2.5-coder:7b-instruct
      api_base: http://ollama:11434
      api_key: dummy
      timeout: 240  # 4 minute timeout for RAG models
      # Development-focused parameters with RAG context
      temperature: 0.15  # Slightly higher for creative solutions with context
      max_tokens: 5120   # Larger for context-aware explanations
      top_p: 0.9        # Balanced for incorporating retrieved knowledge
    model_info:
      enable_rag: true
      vector_store: "qdrant"
      embedding_model: "zoi-embed"
      rag_context_window: 4000

  - model_name: zoi-rag-thinker
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://ollama:11434
      api_key: dummy
      timeout: 240  # 4 minute timeout for RAG models
      # Strategic development planning with RAG context
      temperature: 0.25  # Moderate for architectural decisions with context
      max_tokens: 6144   # Large for comprehensive technical analysis
      top_p: 0.92       # Slightly broader for innovative solutions
    model_info:
      enable_rag: true
      vector_store: "qdrant"
      embedding_model: "zoi-embed"
      rag_context_window: 4000

  # === Development-Optimized Compatibility Aliases ===
  # Common model names that route to our local models with dev-focused parameters
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/Qwen/Qwen3-0.6B
      api_base: http://vllm:8000/v1
      api_key: dummy
      # Development-focused parameters for GPT-3.5 compatibility
      temperature: 0.1   # Low for precise code generation
      max_tokens: 4096   # Increased for longer code examples
      top_p: 0.9        # Focused for technical accuracy
      frequency_penalty: 0.1  # Reduce code repetition

  - model_name: gpt-4
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://ollama:11434
      api_key: dummy
      # Development-focused parameters for GPT-4 compatibility
      temperature: 0.15  # Low-moderate for balanced creativity and precision
      max_tokens: 6144   # Large for comprehensive solutions
      top_p: 0.92       # Slightly broader for innovative approaches

# ------------------------------
# Router groups (optional use)
# ------------------------------
router_settings:
  routes:
    # Complex coding, multi-file, long-context → prefer vLLM for performance
    - name: code_heavy_route
      models: [zoi-coder-vllm, zoi-helper]
      retry_policy: { max_retries: 2, backoff: exponential }

    # General reasoning / plans / critiques
    - name: reason_route
      models: [zoi-thinker, zoi-coder-vllm]
      retry_policy: { max_retries: 2, backoff: exponential }

    # Quick code edits
    - name: code_light_route
      models: [zoi-helper]

    # Embeddings API
    - name: embed_route
      models: [zoi-embed]

# ------------------------------
# Fallbacks (per alias)
# ------------------------------
fallbacks:
  # If heavy coder is busy or fails, try helper
  zoi-coder-30b: [zoi-helper]
  # If thinker fails, bounce to helper or heavy coder
  zoi-thinker: [zoi-helper, zoi-coder-30b]
  # If helper fails, try thinker
  zoi-helper: [zoi-thinker]

# ------------------------------
# (Optional) Cost hints to bias routing toward cheaper models
# ------------------------------
litellm_model_cost_map:
  zoi-coder-30b:
    input_cost_per_token: 0.0000009
    output_cost_per_token: 0.0000012
  zoi-thinker:
    input_cost_per_token: 0.0000004
    output_cost_per_token: 0.0000006
  zoi-helper:
    input_cost_per_token: 0.0000003
    output_cost_per_token: 0.0000004
  zoi-embed:
    input_cost_per_token: 0.0000002
    output_cost_per_token: 0.0000002
