name: zoi-tools

services:

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "7300:5678"
    environment:
      # Database Configuration (PostgreSQL from llm-local stack)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=litellm_password123
      # Security
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_DISABLE_PRODUCTION_MAIN_PROCESS=false
      # Webhooks
      - WEBHOOK_URL=http://n8n.zoi.local
      - N8N_PAYLOAD_SIZE_MAX=16
      # Additional settings
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config/n8n/workflows:/workflows:ro
      - /etc/localtime:/etc/localtime:ro
    # Note: External dependencies on traefik and authentik-server from platform stack
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5678/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      
      # Webhook/API routes - higher priority, no authentication (direct access)
      - "traefik.http.routers.n8n-webhooks.rule=Host(`n8n.${DOMAIN:-zoi.local}`) && (PathPrefix(`/webhook`) || PathPrefix(`/api`))"
      - "traefik.http.routers.n8n-webhooks.entrypoints=web"
      - "traefik.http.routers.n8n-webhooks.priority=100"
      - "traefik.http.routers.n8n-webhooks.service=n8n"
      
      # Frontend/UI routes - lower priority, with authentication
      - "traefik.http.routers.n8n-frontend.rule=Host(`n8n.${DOMAIN:-zoi.local}`)"
      - "traefik.http.routers.n8n-frontend.entrypoints=web"
      - "traefik.http.routers.n8n-frontend.priority=50"
      - "traefik.http.routers.n8n-frontend.middlewares=n8n-frontend-auth@file"
      - "traefik.http.routers.n8n-frontend.service=n8n"
      
      # Service definition
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      
      # Separate router for outpost callbacks without forward auth to prevent infinite loops  
      - "traefik.http.routers.n8n-outpost.rule=Host(`n8n.${DOMAIN:-zoi.local}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.n8n-outpost.entrypoints=web"
      - "traefik.http.routers.n8n-outpost.service=authentik"
      - "traefik.http.routers.n8n-outpost.priority=200"
    networks:
      - zoi-network

  # OpenWebUI AI Chat Interface
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.6.15
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "7301:8088"
    environment:
      # Database Configuration (PostgreSQL from llm-local stack)
      - DATABASE_URL=postgresql://postgres:litellm_password123@postgres:5432/openwebui
      # LiteLLM Integration
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=sk-wqn0xwq_vha4MVM2yzw
      # Interface Settings
      - WEBUI_NAME=Zoi AI Chat
      - WEBUI_URL=http://openwebui.zoi.local
      - DEFAULT_MODELS=zoi-auto,qwen2.5-coder:7b-instruct
      # Features
      - ENABLE_RAG=true
      - ENABLE_WEB_SEARCH=false
      - ENABLE_IMAGE_GENERATION=false
      # Security
      - WEBUI_SECRET_KEY=openwebui-secret-key-change-in-production
    volumes:
      - openwebui_data:/app/data
      - /etc/localtime:/etc/localtime:ro
    # Note: External dependency on traefik from platform stack
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      
      # API/Webhook routes - higher priority, no authentication
      - "traefik.http.routers.openwebui-api.rule=Host(`openwebui.${DOMAIN:-zoi.local}`) && (PathPrefix(`/api`) || PathPrefix(`/webhook`))"
      - "traefik.http.routers.openwebui-api.entrypoints=web"
      - "traefik.http.routers.openwebui-api.priority=100"
      - "traefik.http.routers.openwebui-api.service=openwebui"
      
      # Frontend/UI routes - lower priority, with authentication
      - "traefik.http.routers.openwebui-frontend.rule=Host(`openwebui.${DOMAIN:-zoi.local}`)"
      - "traefik.http.routers.openwebui-frontend.entrypoints=web"
      - "traefik.http.routers.openwebui-frontend.priority=50"
      - "traefik.http.routers.openwebui-frontend.middlewares=openwebui-frontend-auth@file"
      - "traefik.http.routers.openwebui-frontend.service=openwebui"
      
      # Service definition
      - "traefik.http.services.openwebui.loadbalancer.server.port=8088"
      
      # Authentik outpost callbacks - highest priority
      - "traefik.http.routers.openwebui-outpost.rule=Host(`openwebui.${DOMAIN:-zoi.local}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.openwebui-outpost.entrypoints=web"
      - "traefik.http.routers.openwebui-outpost.service=authentik"
      - "traefik.http.routers.openwebui-outpost.priority=200"
    networks:
      - zoi-network

  # LobeChat AI Chat Interface
  lobechat:
    image: lobehub/lobe-chat-database:latest
    container_name: lobechat
    restart: unless-stopped
    ports:
      - "7302:3210"
    environment:
      # Server Mode Configuration - Required for image generation
      - NEXT_PUBLIC_SERVICE_MODE=server
      - APP_URL=${LOBECHAT_APP_URL:-http://localhost:7302}
      # Database Configuration
      - DATABASE_URL=${LOBECHAT_DATABASE_URL:-postgresql://postgres:litellm_password123@postgres:5432/lobechat}
      - KEY_VAULTS_SECRET=${LOBECHAT_KEY_VAULTS_SECRET:-lobechat-vault-secret-key-change-in-production}
      # Authentication - Disable NextAuth entirely
      - NEXT_PUBLIC_ENABLE_NEXT_AUTH=0
      # AI Provider Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-wqn0xwq_vha4MVM2yzw}
      - OPENAI_PROXY_URL=${OPENAI_PROXY_URL:-http://litellm:4000/v1}
      # S3 Storage Configuration (for image generation)
      - S3_ACCESS_KEY_ID=${LOBECHAT_S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${LOBECHAT_S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_ENDPOINT=${LOBECHAT_S3_ENDPOINT:-http://minio:9000}
      - S3_BUCKET=${LOBECHAT_S3_BUCKET:-lobechat}
      - S3_PUBLIC_DOMAIN=${LOBECHAT_S3_PUBLIC_DOMAIN:-http://localhost:7303/lobechat}
      - S3_ENABLE_PATH_STYLE=1
      # Optional Configuration
      - ACCESS_CODE=${LOBECHAT_ACCESS_CODE:-}
      - NEXT_PUBLIC_BASE_PATH=${LOBECHAT_BASE_PATH:-}
    volumes:
      - lobechat_data:/app/.next/cache
      - lobechat_config:/app/config
      - lobechat_uploads:/app/public/uploads
      - /etc/localtime:/etc/localtime:ro
    # Note: External dependency on traefik from platform stack
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3210/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"

      # API/Webhook routes - higher priority, no authentication
      - "traefik.http.routers.lobechat-api.rule=Host(`lobechat.${DOMAIN:-zoi.local}`) && (PathPrefix(`/api`) || PathPrefix(`/webhook`))"
      - "traefik.http.routers.lobechat-api.entrypoints=web"
      - "traefik.http.routers.lobechat-api.priority=100"
      - "traefik.http.routers.lobechat-api.service=lobechat"

      # Frontend/UI routes - lower priority, with authentication
      - "traefik.http.routers.lobechat-frontend.rule=Host(`lobechat.${DOMAIN:-zoi.local}`)"
      - "traefik.http.routers.lobechat-frontend.entrypoints=web"
      - "traefik.http.routers.lobechat-frontend.priority=50"
      - "traefik.http.routers.lobechat-frontend.middlewares=lobechat-frontend-auth@file"
      - "traefik.http.routers.lobechat-frontend.service=lobechat"

      # Service definition
      - "traefik.http.services.lobechat.loadbalancer.server.port=3210"

      # Authentik outpost callbacks - highest priority
      - "traefik.http.routers.lobechat-outpost.rule=Host(`lobechat.${DOMAIN:-zoi.local}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.lobechat-outpost.entrypoints=web"
      - "traefik.http.routers.lobechat-outpost.service=authentik"
      - "traefik.http.routers.lobechat-outpost.priority=200"
    networks:
      - zoi-network

  # MinIO S3-compatible storage for image generation
  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "7303:9000"  # API port
      - "7304:9001"  # Console port
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_API_CORS_ALLOW_ORIGIN=http://lobechat.zoi.local,http://localhost:7302
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"

      # MinIO API routes
      - "traefik.http.routers.minio-api.rule=Host(`minio.${DOMAIN:-zoi.local}`)"
      - "traefik.http.routers.minio-api.entrypoints=web"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"

      # MinIO Console routes
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.${DOMAIN:-zoi.local}`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
    networks:
      - zoi-network

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  qdrant_data:
  dashy_data:
  portal_data:
  authentik_media:
  authentik_templates:
  n8n_data:
  openwebui_data:
  lobechat_data:
  lobechat_config:
  lobechat_uploads:
  minio_data:

networks:
  zoi-network:
    name: zoi-network
    external: true
