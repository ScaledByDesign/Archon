name: zoi-tools

services:

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "7300:5678"
    environment:
      # Database Configuration (PostgreSQL from llm-local stack)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=litellm_password123
      # Security
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_DISABLE_PRODUCTION_MAIN_PROCESS=false
      # Webhooks
      - WEBHOOK_URL=http://n8n.zoi.local
      - N8N_PAYLOAD_SIZE_MAX=16
      # Additional settings
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config/n8n/workflows:/workflows:ro
      - /etc/localtime:/etc/localtime:ro
    # Note: External dependencies on traefik and authentik-server from platform stack
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5678/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      
      # Webhook/API routes - higher priority, no authentication (direct access)
      - "traefik.http.routers.n8n-webhooks.rule=Host(`n8n.${DOMAIN:-zoi.local}`) && (PathPrefix(`/webhook`) || PathPrefix(`/api`))"
      - "traefik.http.routers.n8n-webhooks.entrypoints=web"
      - "traefik.http.routers.n8n-webhooks.priority=100"
      - "traefik.http.routers.n8n-webhooks.service=n8n"
      
      # Frontend/UI routes - lower priority, with authentication
      - "traefik.http.routers.n8n-frontend.rule=Host(`n8n.${DOMAIN:-zoi.local}`)"
      - "traefik.http.routers.n8n-frontend.entrypoints=web"
      - "traefik.http.routers.n8n-frontend.priority=50"
      - "traefik.http.routers.n8n-frontend.middlewares=n8n-frontend-auth@file"
      - "traefik.http.routers.n8n-frontend.service=n8n"
      
      # Service definition
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      
      # Separate router for outpost callbacks without forward auth to prevent infinite loops  
      - "traefik.http.routers.n8n-outpost.rule=Host(`n8n.${DOMAIN:-zoi.local}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.n8n-outpost.entrypoints=web"
      - "traefik.http.routers.n8n-outpost.service=authentik"
      - "traefik.http.routers.n8n-outpost.priority=200"
    networks:
      - zoi-network

  # OpenWebUI AI Chat Interface
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.6.15
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "7301:8088"
    environment:
      # Database Configuration (PostgreSQL from llm-local stack)
      - DATABASE_URL=postgresql://postgres:litellm_password123@postgres:5432/openwebui
      # LiteLLM Integration
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=sk-wqn0xwq_vha4MVM2yzw
      # Interface Settings
      - WEBUI_NAME=Zoi AI Chat
      - WEBUI_URL=http://openwebui.zoi.local
      - DEFAULT_MODELS=zoi-auto,qwen2.5-coder:7b-instruct
      # Features
      - ENABLE_RAG=true
      - ENABLE_WEB_SEARCH=false
      - ENABLE_IMAGE_GENERATION=false
      # Security
      - WEBUI_SECRET_KEY=openwebui-secret-key-change-in-production
    volumes:
      - openwebui_data:/app/data
      - /etc/localtime:/etc/localtime:ro
    # Note: External dependency on traefik from platform stack
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      
      # API/Webhook routes - higher priority, no authentication
      - "traefik.http.routers.openwebui-api.rule=Host(`openwebui.${DOMAIN:-zoi.local}`) && (PathPrefix(`/api`) || PathPrefix(`/webhook`))"
      - "traefik.http.routers.openwebui-api.entrypoints=web"
      - "traefik.http.routers.openwebui-api.priority=100"
      - "traefik.http.routers.openwebui-api.service=openwebui"
      
      # Frontend/UI routes - lower priority, with authentication
      - "traefik.http.routers.openwebui-frontend.rule=Host(`openwebui.${DOMAIN:-zoi.local}`)"
      - "traefik.http.routers.openwebui-frontend.entrypoints=web"
      - "traefik.http.routers.openwebui-frontend.priority=50"
      - "traefik.http.routers.openwebui-frontend.middlewares=openwebui-frontend-auth@file"
      - "traefik.http.routers.openwebui-frontend.service=openwebui"
      
      # Service definition
      - "traefik.http.services.openwebui.loadbalancer.server.port=8088"
      
      # Authentik outpost callbacks - highest priority
      - "traefik.http.routers.openwebui-outpost.rule=Host(`openwebui.${DOMAIN:-zoi.local}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.openwebui-outpost.entrypoints=web"
      - "traefik.http.routers.openwebui-outpost.service=authentik"
      - "traefik.http.routers.openwebui-outpost.priority=200"
    networks:
      - zoi-network

  # LobeChat AI Chat Interface
  lobechat:
    image: lobehub/lobe-chat-database:latest
    container_name: lobechat
    restart: unless-stopped
    ports:
      - "7302:3210"
    env_file:
      - .env
    environment:
      # Server Mode Configuration - Required for image generation
      - NEXT_PUBLIC_SERVICE_MODE=server
      - APP_URL=${LOBECHAT_APP_URL:-http://localhost:7302}
      # Database Configuration
      - DATABASE_URL=${LOBECHAT_DATABASE_URL:-postgresql://postgres:litellm_password123@postgres:5432/lobechat}
      - KEY_VAULTS_SECRET=${LOBECHAT_KEY_VAULTS_SECRET:-lobechat-vault-secret-key-change-in-production}
      # Authentication - Google SSO Configuration
      - NEXT_PUBLIC_ENABLE_NEXT_AUTH=1
      - NEXT_AUTH_SECRET=${LOBECHAT_NEXTAUTH_SECRET:-lobechat-secret-key-change-in-production}
      - NEXTAUTH_URL=${LOBECHAT_NEXTAUTH_URL:-http://localhost:7302/api/auth}
      - NEXT_AUTH_SSO_PROVIDERS=google
      - AUTH_GOOGLE_ID=${LOBECHAT_GOOGLE_CLIENT_ID:-your-google-client-id}
      - AUTH_GOOGLE_SECRET=${LOBECHAT_GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      # AI Provider Configuration - LiteLLM Integration
      - OPENAI_API_KEY=${LOBECHAT_OPENAI_API_KEY:-sk-wqn0xwq_vha4MVM2yzw}
      - OPENAI_PROXY_URL=${LOBECHAT_OPENAI_PROXY_URL:-http://litellm:4000/v1}
      - OPENAI_MODEL_LIST=${LOBECHAT_OPENAI_MODEL_LIST:-+gpt-4-oss,+gpt-oss,+zoi-auto}
      # Ollama Configuration (disabled since using LiteLLM)
      - ENABLED_OLLAMA=${LOBECHAT_ENABLED_OLLAMA:-0}

      # === LITELLM MCP PLUGIN INTEGRATION ===
      # Configure LobeChat to use LiteLLM's MCP servers directly as plugins
      - PLUGIN_SETTINGS=${LOBECHAT_PLUGIN_SETTINGS:-}

      # === VECTOR DATABASE & RAG CONFIGURATION ===
      # Enable knowledge base and RAG features
      - ENABLE_KNOWLEDGE_BASE=${ENABLE_KNOWLEDGE_BASE:-true}
      - ENABLE_RAG=${ENABLE_RAG:-true}
      - ENABLE_VECTOR_SEARCH=${ENABLE_VECTOR_SEARCH:-true}
      - VECTOR_DIMENSION=${VECTOR_DIMENSION:-1536}

      # UI Feature Flags
      - NEXT_PUBLIC_ENABLE_KNOWLEDGE_BASE=true
      - NEXT_PUBLIC_ENABLE_FILE_UPLOAD=true
      - NEXT_PUBLIC_ENABLE_RAG=true

      # File upload configuration
      - ENABLE_FILE_UPLOAD=${ENABLE_FILE_UPLOAD:-true}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - SUPPORTED_FILE_TYPES=${SUPPORTED_FILE_TYPES:-.txt,.md,.pdf,.docx,.json,.csv}

      # External vector database (Qdrant)
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}

      # === LITELLM VECTOR STORE INTEGRATION ===
      # Connect LobeChat to LiteLLM's vector stores for UI knowledge base access
      - VECTOR_STORE_API_URL=http://litellm:4000
      - VECTOR_STORE_API_KEY=sk-wqn0xwq_vha4MVM2yzw
      - LITELLM_VECTOR_STORE_ENDPOINT=http://litellm:4000/vector_store

      # Enable LiteLLM vector store features in UI
      - NEXT_PUBLIC_ENABLE_VECTOR_STORE=true
      - NEXT_PUBLIC_VECTOR_STORE_PROVIDER=litellm
      - NEXT_PUBLIC_LITELLM_ENDPOINT=http://localhost:7010

      # External graph database (Neo4j) for advanced RAG
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}

      # === UNIFIED RAG SERVICE INTEGRATION ===
      # Cross-collection knowledge access for 100% context
      - UNIFIED_RAG_URL=${UNIFIED_RAG_URL:-http://unified-rag:8000}
      - UNIFIED_RAG_ENABLED=${UNIFIED_RAG_ENABLED:-true}
      - POSTGRES_SHARED_URL=${POSTGRES_SHARED_URL:-postgresql://postgres:litellm_password123@postgres:5432/postgres}

      # Configure LobeChat to use unified RAG as primary knowledge source
      - KNOWLEDGE_BASE_URL=http://unified-rag:8000
      - KNOWLEDGE_BASE_SEARCH_ENDPOINT=/search
      - KNOWLEDGE_BASE_COLLECTIONS_ENDPOINT=/collections
      - NEXT_PUBLIC_KNOWLEDGE_BASE_API=http://localhost:7090

      # Enable cross-collection search
      - NEXT_PUBLIC_ENABLE_UNIFIED_RAG=true
      - NEXT_PUBLIC_CROSS_COLLECTION_SEARCH=true

      # === ZOI KNOWLEDGE BASE CONFIGURATION ===
      # Pre-configure ZOI knowledge collections for easy access
      - ZOI_KNOWLEDGE_COLLECTIONS=zoi_knowledge_base,code_embeddings,archon_knowledge
      - DEFAULT_VECTOR_STORE_ID=zoi_knowledge_base
      - KNOWLEDGE_BASE_NAME=ZOI AI Ecosystem Knowledge
      - NEXT_PUBLIC_DEFAULT_KNOWLEDGE_BASE=zoi_knowledge_base

      # === MINIO S3 STORAGE CONFIGURATION ===
      # S3 configuration is now handled via .env file
      # This ensures proper separation of internal/external endpoints

      # Enable MCP tools through function calling
      - ENABLE_TOOLS_CALLING=1
      - TOOLS_CALLING_TYPE=mcp

      # MCP Authentication
      - MCP_AUTH_HEADER=x-litellm-api-key
      - MCP_AUTH_TOKEN=Bearer sk-wqn0xwq_vha4MVM2yzw
      # S3 Storage Configuration (using .env file values)
      # S3 configuration is handled via .env file to avoid override conflicts
      # Optional Configuration
      - ACCESS_CODE=${LOBECHAT_ACCESS_CODE:-}
      - NEXT_PUBLIC_BASE_PATH=${LOBECHAT_BASE_PATH:-}
    volumes:
      - lobechat_data:/app/.next/cache
      - lobechat_config:/app/config
      - lobechat_uploads:/app/public/uploads
      - /etc/localtime:/etc/localtime:ro
    # Note: External dependency on traefik from platform stack
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3210/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"

      # API/Webhook routes - higher priority, no authentication
      - "traefik.http.routers.lobechat-api.rule=Host(`lobechat.${DOMAIN:-zoi.local}`) && (PathPrefix(`/api`) || PathPrefix(`/webhook`))"
      - "traefik.http.routers.lobechat-api.entrypoints=web"
      - "traefik.http.routers.lobechat-api.priority=100"
      - "traefik.http.routers.lobechat-api.service=lobechat"

      # Frontend/UI routes - lower priority, with authentication
      - "traefik.http.routers.lobechat-frontend.rule=Host(`lobechat.${DOMAIN:-zoi.local}`)"
      - "traefik.http.routers.lobechat-frontend.entrypoints=web"
      - "traefik.http.routers.lobechat-frontend.priority=50"
      - "traefik.http.routers.lobechat-frontend.middlewares=lobechat-frontend-auth@file"
      - "traefik.http.routers.lobechat-frontend.service=lobechat"

      # Service definition
      - "traefik.http.services.lobechat.loadbalancer.server.port=3210"

      # Authentik outpost callbacks - highest priority
      - "traefik.http.routers.lobechat-outpost.rule=Host(`lobechat.${DOMAIN:-zoi.local}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.lobechat-outpost.entrypoints=web"
      - "traefik.http.routers.lobechat-outpost.service=authentik"
      - "traefik.http.routers.lobechat-outpost.priority=200"
    networks:
      - zoi-network

  # MinIO S3-compatible storage is provided by the core stack
  # Running on ports 7065 (API) and 7066 (Console)
  # No need for duplicate MinIO service here

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  qdrant_data:
  dashy_data:
  portal_data:
  authentik_media:
  authentik_templates:
  n8n_data:
  openwebui_data:
  lobechat_data:
  lobechat_config:
  lobechat_uploads:

networks:
  zoi-network:
    name: zoi-network
    external: true
