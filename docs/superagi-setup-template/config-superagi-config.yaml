# SuperAGI Configuration Template for Qdrant + LiteLLM Setup
# Copy this to config/superagi/config.yaml

# Database Configuration
POSTGRES_URL: postgresql://superagi:password@postgres/superagi
POSTGRES_DATABASE_URL: postgresql://superagi:password@postgres/superagi

# Redis Configuration  
REDIS_URL: redis://redis:6379/0

# LiteLLM Integration - IMPORTANT CHANGE
OPENAI_API_BASE: http://litellm:4000/v1

# Frontend URL
FRONTEND_URL: "http://zoi.local:3001"

# Encryption Key (Replace with your own for production)
ENCRYPTION_KEY: abcdefghijklmnopqrstuvwxyz123456

# Weaviate Configuration - DISABLED for Qdrant
WEAVIATE_USE_EMBEDDED: false

# Qdrant Configuration - ENABLED
QDRANT_HOST_NAME: qdrant
QDRANT_PORT: 6333

# Vector Store Configuration - Set Qdrant as default
VECTOR_STORE: qdrant

# Tools Configuration (Optional - add your own keys)
GOOGLE_API_KEY: YOUR_GOOGLE_API_KEY
SEARCH_ENGINE_ID: YOUR_SEARCH_ENGINE_ID
SERP_API_KEY: YOUR_SERPER_API_KEY

# Other configurations...
PINECONE_API_KEY: YOUR_PINECONE_API_KEY
PINECONE_ENVIRONMENT: YOUR_PINECONE_ENVIRONMENT
