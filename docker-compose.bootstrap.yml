# Docker Compose override for bootstrap and development features
version: '3.8'

services:
  # Bootstrap initialization service
  bootstrap:
    image: alpine:latest
    container_name: zoi-bootstrap
    restart: "no"
    volumes:
      - ./scripts:/scripts:ro
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: >
      sh -c "
        apk add --no-cache curl docker-cli &&
        chmod +x /scripts/bootstrap-init.sh &&
        /scripts/bootstrap-init.sh
      "
    depends_on:
      - traefik
      - postgres
    networks:
      - frontend_network
      - backend_network

  # Authentik with auto-blueprint application
  authentik-server:
    volumes:
      - ./config/authentik/blueprints:/blueprints/custom:ro
      - ./scripts/authentik-bootstrap.sh:/docker-entrypoint-post.d/apply-blueprints.sh:ro
    environment:
      - AUTHENTIK_BOOTSTRAP_PASSWORD=password123
      - AUTHENTIK_BOOTSTRAP_TOKEN=bootstrap-token-change-me

  # n8n with bootstrap configuration
  n8n:
    environment:
      # Additional environment variables for bootstrap
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_LOG_LEVEL=info
      - N8N_METRICS=true
      # Pre-configure some settings
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BINARY_DATA_TTL=1440
      - N8N_USER_MANAGEMENT_DISABLED=true  # Since we use Authentik
    volumes:
      - ./config/n8n/workflows:/home/node/.n8n/workflows:rw
      - ./config/n8n/credentials:/home/node/.n8n/credentials:rw
      - ./scripts/n8n-bootstrap.sh:/docker-entrypoint-post.d/n8n-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL with additional initialization
  postgres:
    volumes:
      - ./config/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
      - ./scripts/postgres-bootstrap.sql:/docker-entrypoint-initdb.d/bootstrap.sql:ro
    environment:
      # Auto-create additional databases
      - POSTGRES_MULTIPLE_DATABASES=fastapi,healthchecks,authentik,litellm,n8n

  # Development tools service
  dev-tools:
    image: alpine:latest
    container_name: zoi-dev-tools
    restart: "no"
    volumes:
      - ./:/workspace:rw
      - ./scripts:/scripts:ro
    working_dir: /workspace
    command: >
      sh -c "
        apk add --no-cache curl jq docker-cli git &&
        echo 'Development tools ready!' &&
        echo 'Available commands:' &&
        echo '  - curl: Test HTTP endpoints' &&
        echo '  - jq: Parse JSON responses' &&
        echo '  - docker: Interact with containers' &&
        echo '  - git: Version control' &&
        tail -f /dev/null
      "
    networks:
      - frontend_network
      - backend_network
      - database_network

networks:
  frontend_network:
    external: false
  backend_network:
    external: false
  database_network:
    external: false
