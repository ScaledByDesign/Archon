[tool:pytest]
minversion = 7.0
addopts = 
    -ra 
    --strict-markers 
    --strict-config 
    --cov=src 
    --cov-report=term-missing:skip-covered 
    --cov-report=html:htmlcov 
    --cov-report=xml
    --tb=short
    --timeout=300
    -v
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require services)
    component: Component tests (test complete components)
    slow: Slow running tests (> 5 seconds)
    live: Live testing against real services (requires LIVE_TESTING=true)
    auth: Authentication and authorization tests
    database: Database integration tests
    llm: Large Language Model integration tests
    performance: Performance and benchmark tests
    requires_docker: Tests that require Docker services
    requires_vault: Tests that require HashiCorp Vault
    requires_qdrant: Tests that require Qdrant vector store
    requires_redis: Tests that require Redis
    requires_mongodb: Tests that require MongoDB
    requires_authentik: Tests that require Authentik authentication
    requires_llm: Tests that require LLM services
asyncio_mode = auto
timeout = 300
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::ResourceWarning
