version: '3.8'

# Docker Compose override for testing
# Usage: docker-compose -f docker-compose.yml -f docker-compose.test.yml up

services:
  # Test-specific FastAPI service
  fastapi-test:
    build: .
    restart: "no"
    command: ["python", "-m", "pytest", "tests/", "-v", "--tb=short"]
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROOT_TOKEN=${VAULT_ROOT_TOKEN:-test-root-token}
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://mongo-episodic:27017
      - QDRANT_URL=http://qdrant:6333
      - RABBITMQ_URL=amqp://admin:secretpass@rabbitmq:5672
      - LITELLM_URL=http://litellm:8000
      - JWT_SECRET_KEY=test-jwt-secret-key-for-testing-only
      - SESSION_SECRET_KEY=test-session-secret-key-for-testing-only
      - PYTHONPATH=/app/src
      - TESTING=true
      - TZ=America/Chicago
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./Makefile:/app/Makefile:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - vault
      - qdrant
    networks:
      - backend_network
      - database_network
      - infrastructure_network

  # Unit tests only (no dependencies)
  fastapi-unit-tests:
    build: .
    restart: "no"
    command: ["python", "-m", "pytest", "tests/unit/", "-v", "--tb=short"]
    environment:
      - PYTHONPATH=/app/src
      - TESTING=true
      - TZ=America/Chicago
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./requirements.txt:/app/requirements.txt:ro
    networks:
      - backend_network

  # Integration tests (requires services)
  fastapi-integration-tests:
    build: .
    restart: "no"
    command: ["python", "-m", "pytest", "tests/integration/", "-v", "--tb=short", "-m", "not slow"]
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROOT_TOKEN=${VAULT_ROOT_TOKEN:-test-root-token}
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://mongo-episodic:27017
      - QDRANT_URL=http://qdrant:6333
      - PYTHONPATH=/app/src
      - TESTING=true
      - TZ=America/Chicago
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./requirements.txt:/app/requirements.txt:ro
    depends_on:
      - redis
      - vault
      - qdrant
    networks:
      - backend_network
      - database_network
      - infrastructure_network

  # Component tests (requires external services)
  fastapi-component-tests:
    build: .
    restart: "no"
    command: ["python", "-m", "pytest", "tests/component/", "-v", "--tb=short"]
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROOT_TOKEN=${VAULT_ROOT_TOKEN:-test-root-token}
      - QDRANT_URL=http://qdrant:6333
      - PYTHONPATH=/app/src
      - TESTING=true
      - TZ=America/Chicago
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./requirements.txt:/app/requirements.txt:ro
    depends_on:
      - vault
      - qdrant
    networks:
      - backend_network
      - infrastructure_network

networks:
  backend_network:
    external: true
  database_network:
    external: true
  infrastructure_network:
    external: true
